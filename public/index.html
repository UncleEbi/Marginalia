<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marginalia — Read-Along Reader</title>

  <!-- Client-Side Document Parsers -->
  <!-- 1. PDF Parser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- 2. Word (.docx) Parser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <!-- 3. EPUB (.epub) Container Unzipper -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script>
    // Configure PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <style>
    :root {
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
      --transition: 0.25s ease;
    }

    [data-theme="light"] {
      --bg-color: #f8fafc;
      --panel-bg: #ffffff;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent-color: #2563eb;
      --highlight-bg: #fef08a;
      --highlight-text: #000000;
    }

    [data-theme="sepia"] {
      --bg-color: #f4ecd8;
      --panel-bg: #eadeca;
      --text-color: #433422;
      --text-muted: #7f6a52;
      --border-color: #d8c8b0;
      --accent-color: #8b5a2b;
      --highlight-bg: #d4a373;
      --highlight-text: #ffffff;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --text-color: #f1f5f9;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent-color: #38bdf8;
      --highlight-bg: #0284c7;
      --highlight-text: #ffffff;
    }

    [data-theme="oled"] {
      --bg-color: #000000;
      --panel-bg: #111111;
      --text-color: #ededed;
      --text-muted: #777777;
      --border-color: #222222;
      --accent-color: #10b981;
      --highlight-bg: #059669;
      --highlight-text: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color var(--transition), color var(--transition);
    }

    header {
      padding: 0.85rem 1.75rem;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand { font-weight: 700; font-size: 1.25rem; letter-spacing: -0.5px; }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    select, button, label.btn-upload {
      background: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 0.45rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      user-select: none;
    }

    button:hover, select:hover, label.btn-upload:hover { border-color: var(--accent-color); }
    button.primary {
      background: var(--accent-color);
      color: #fff;
      border: none;
      font-weight: 600;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 2.5rem 1rem;
    }

    .reader-card {
      max-width: 780px;
      width: 100%;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 3rem 2.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 480px;
    }

    .book-content {
      font-size: 1.25rem;
      line-height: 2.1;
      user-select: text;
    }

    .status-msg {
      text-align: center;
      color: var(--text-muted);
      font-style: italic;
      padding: 2rem 0;
    }

    .sentence {
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      transition: background-color 0.15s ease;
    }
    .sentence:hover {
      text-decoration: underline;
    }
    .sentence.active-sentence {
      background-color: var(--highlight-bg);
      color: var(--highlight-text);
      font-weight: 500;
    }

    .footer-bar {
      margin-top: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 1.5rem;
    }

    .page-indicator {
      font-size: 0.9rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">Marginalia</div>

    <div class="controls-row">
      <!-- Universal File Upload -->
      <label class="btn-upload" for="fileInput">
        📁 Open File
      </label>
      <input type="file" id="fileInput" accept=".txt,.md,.rtf,.pdf,.docx,.epub,.html,.htm" style="display:none;" />

      <!-- Theme Selection -->
      <label for="themeSelect">Theme:</label>
      <select id="themeSelect">
        <option value="light">Clean Light</option>
        <option value="sepia">Sepia Book</option>
        <option value="dark">Nord Dark</option>
        <option value="oled">OLED Pitch Black</option>
      </select>

      <!-- Engine Picker -->
      <label for="engineSelect">Voice:</label>
      <select id="engineSelect">
        <option value="browser">Free Native Engine</option>
        <option value="neural">Cloud Neural (Serverless)</option>
      </select>

      <!-- Autoplay Toggle -->
      <label style="display:flex; align-items:center; gap:0.3rem; font-size:0.85rem; cursor:pointer;">
        <input type="checkbox" id="autoFlipCheck" checked />
        Auto-turn page
      </label>

      <button id="playBtn" class="primary">▶ Play</button>
      <button id="pauseBtn">⏸ Pause</button>
    </div>
  </header>

  <main>
    <div class="reader-card">
      <div id="contentPane" class="book-content"></div>

      <div class="footer-bar">
        <button id="prevPageBtn">← Previous Page</button>
        <span id="pageIndicator" class="page-indicator">Page 1 of 1</span>
        <button id="nextPageBtn">Next Page →</button>
      </div>
    </div>
  </main>

  <audio id="neuralAudio" style="display:none;"></audio>

  <script>
    let bookPages = [
      [
        "Welcome to Marginalia.",
        "Click 'Open File' in the toolbar to import your books and documents.",
        "Supported formats include EPUB, PDF, DOCX, Markdown, HTML, and TXT.",
        "Your reading progress and audio continue automatically across pages."
      ]
    ];

    let currentPage = 0;
    let currentSentenceIdx = 0;
    let isPlaying = false;
    const browserSpeech = window.speechSynthesis;
    let currentUtterance = null;
    const audioElement = document.getElementById('neuralAudio');

    // DOM Elements
    const fileInput = document.getElementById('fileInput');
    const contentPane = document.getElementById('contentPane');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');
    const prevPageBtn = document.getElementById('prevPageBtn');
    const pageIndicator = document.getElementById('pageIndicator');
    const autoFlipCheck = document.getElementById('autoFlipCheck');
    const themeSelect = document.getElementById('themeSelect');
    const engineSelect = document.getElementById('engineSelect');

    // --- UNIVERSAL FILE LOADER ---
    fileInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      stopAudio();
      contentPane.innerHTML = `<div class="status-msg">Extracting text from "${file.name}"...</div>`;

      try {
        const ext = file.name.split('.').pop().toLowerCase();
        let extractedText = "";

        if (ext === 'txt' || ext === 'md' || ext === 'rtf') {
          extractedText = await file.text();
        } 
        else if (ext === 'html' || ext === 'htm') {
          const rawHtml = await file.text();
          const doc = new DOMParser().parseFromString(rawHtml, 'text/html');
          extractedText = doc.body.innerText || doc.body.textContent || "";
        } 
        else if (ext === 'docx') {
          const arrayBuffer = await file.arrayBuffer();
          const result = await mammoth.extractRawText({ arrayBuffer });
          extractedText = result.value;
        } 
        else if (ext === 'pdf') {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          let pagesText = [];
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            const text = content.items.map(item => item.str).join(' ');
            pagesText.push(text);
          }
          extractedText = pagesText.join('\n\n');
        } 
        else if (ext === 'epub') {
          const arrayBuffer = await file.arrayBuffer();
          const zip = await JSZip.loadAsync(arrayBuffer);
          
          // Locate and extract all XHTML/HTML chapter contents in the EPUB archive
          const chapterFiles = Object.keys(zip.files).filter(name => 
            (name.endsWith('.xhtml') || name.endsWith('.html') || name.endsWith('.htm')) && 
            !name.toLowerCase().includes('toc')
          ).sort();

          let fullEpub = [];
          for (const chap of chapterFiles) {
            const rawContent = await zip.files[chap].async("text");
            const doc = new DOMParser().parseFromString(rawContent, 'text/html');
            const cleanText = doc.body.innerText || doc.body.textContent || "";
            if (cleanText.trim()) fullEpub.push(cleanText.trim());
          }
          extractedText = fullEpub.join('\n\n');
        } 
        else {
          alert(`Unsupported file format: .${ext}`);
          renderPage(currentPage);
          return;
        }

        paginateRawText(extractedText);
      } catch (err) {
        console.error("File parsing error:", err);
        alert(`Failed to load document: ${err.message}`);
        renderPage(currentPage);
      }
    });

    // Split text into coherent sentences and chunk into clean 5-sentence pages
    function paginateRawText(rawText) {
      const sanitized = rawText
        .replace(/\r\n/g, ' ')
        .replace(/\n+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      const sentenceRegex = /[^.!?]+[.!?]+(?:\s|$)\vert{}[^.!?]+$/g;
      const matches = sanitized.match(sentenceRegex) || [sanitized];
      const cleaned = matches.map(s => s.trim()).filter(s => s.length > 0);

      if (cleaned.length === 0) {
        alert("No readable text found in document.");
        return;
      }

      bookPages = [];
      const sentencesPerPage = 5;
      for (let i = 0; i < cleaned.length; i += sentencesPerPage) {
        bookPages.push(cleaned.slice(i, i + sentencesPerPage));
      }

      currentPage = 0;
      currentSentenceIdx = 0;
      renderPage(currentPage);
    }

    // --- THEME MANAGEMENT ---
    function initTheme() {
      const savedTheme = localStorage.getItem('marginalia_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      themeSelect.value = savedTheme;

      themeSelect.addEventListener('change', (e) => {
        const selected = e.target.value;
        document.documentElement.setAttribute('data-theme', selected);
        localStorage.setItem('marginalia_theme', selected);
      });
    }

    // --- PAGE RENDERING ---
    function renderPage(pageIdx) {
      contentPane.innerHTML = '';
      const sentences = bookPages[pageIdx] || [];

      sentences.forEach((txt, idx) => {
        const span = document.createElement('span');
        span.className = 'sentence';
        span.id = `sent-${idx}`;
        span.textContent = txt + ' ';
        span.addEventListener('click', () => {
          currentSentenceIdx = idx;
          if (isPlaying) {
            stopAudio();
            playCurrentSentence();
          } else {
            updateSentenceHighlight();
          }
        });
        contentPane.appendChild(span);
      });

      pageIndicator.textContent = `Page ${pageIdx + 1} of ${bookPages.length}`;
      prevPageBtn.disabled = pageIdx === 0;
      nextPageBtn.disabled = pageIdx >= bookPages.length - 1;
      updateSentenceHighlight();
    }

    function updateSentenceHighlight() {
      document.querySelectorAll('.sentence').forEach(el => el.classList.remove('active-sentence'));
      const activeEl = document.getElementById(`sent-${currentSentenceIdx}`);
      if (activeEl) {
        activeEl.classList.add('active-sentence');
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    // --- SPEECH ENGINE ---
    async function playCurrentSentence() {
      const pageSentences = bookPages[currentPage];
      if (!pageSentences || pageSentences.length === 0) return;

      // Auto-page progression
      if (currentSentenceIdx >= pageSentences.length) {
        if (autoFlipCheck.checked && currentPage < bookPages.length - 1) {
          currentPage++;
          currentSentenceIdx = 0;
          renderPage(currentPage);
          playCurrentSentence();
        } else {
          stopAudio();
        }
        return;
      }

      updateSentenceHighlight();
      const textToRead = pageSentences[currentSentenceIdx];
      const selectedEngine = engineSelect.value;

      if (selectedEngine === 'browser') {
        speakNative(textToRead);
      } else {
        await speakNeural(textToRead);
      }
    }

    function speakNative(text) {
      browserSpeech.cancel();
      currentUtterance = new SpeechSynthesisUtterance(text);
      currentUtterance.rate = 1.0;

      currentUtterance.onend = () => {
        if (!isPlaying) return;
        currentSentenceIdx++;
        playCurrentSentence();
      };

      currentUtterance.onerror = (e) => {
        console.error("SpeechSynthesis error:", e);
        stopAudio();
      };

      browserSpeech.speak(currentUtterance);
    }

    async function speakNeural(text) {
      try {
        const token = localStorage.getItem('sb_access_token') || '';

        const res = await fetch('/api/tts', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            text: text,
            voiceId: '21m00Tcm4TlvDq8ikWAM',
            engine: 'elevenlabs'
          })
        });

        if (res.status === 402) {
          alert("Neural credits exhausted. Swapped to native engine.");
          engineSelect.value = 'browser';
          speakNative(text);
          return;
        }

        if (!res.ok) throw new Error(`Proxy error: ${res.status}`);
        const data = await res.json();

        const audioSrc = data.audio_base64 
          ? `data:audio/mp3;base64,${data.audio_base64}`
          : (data.audioUrl || '');

        audioElement.src = audioSrc;
        audioElement.play();

        audioElement.onended = () => {
          if (!isPlaying) return;
          currentSentenceIdx++;
          playCurrentSentence();
        };

      } catch (err) {
        console.warn("Neural backend unavailable, falling back to native voice:", err);
        speakNative(text);
      }
    }

    function stopAudio() {
      isPlaying = false;
      browserSpeech.cancel();
      audioElement.pause();
      audioElement.currentTime = 0;
    }

    // --- CONTROLS ---
    playBtn.addEventListener('click', () => {
      isPlaying = true;
      playCurrentSentence();
    });

    pauseBtn.addEventListener('click', () => {
      stopAudio();
    });

    nextPageBtn.addEventListener('click', () => {
      if (currentPage < bookPages.length - 1) {
        currentPage++;
        currentSentenceIdx = 0;
        const wasPlaying = isPlaying;
        stopAudio();
        renderPage(currentPage);
        if (wasPlaying) {
          isPlaying = true;
          playCurrentSentence();
        }
      }
    });

    prevPageBtn.addEventListener('click', () => {
      if (currentPage > 0) {
        currentPage--;
        currentSentenceIdx = 0;
        const wasPlaying = isPlaying;
        stopAudio();
        renderPage(currentPage);
        if (wasPlaying) {
          isPlaying = true;
          playCurrentSentence();
        }
      }
    });

    // Initialize
    initTheme();
    renderPage(currentPage);
  </script>
</body>
</html>
