<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marginalia — Read-Along Reader</title>

  <!-- Client-Side Document Parsers -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <style>
    :root {
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-reader: "Georgia", "Merriweather", "Charter", serif;
      --transition: 0.2s ease;
    }

    /* THEMES */
    [data-theme="light"] {
      --bg-main: #f8fafc;
      --panel-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent-active: #1d4ed8;
      --highlight: rgba(254, 215, 10, 0.4);
      --highlight-border: #f59e0b;
      --tab-active-bg: #f1f5f9;
    }

    [data-theme="sepia"] {
      --bg-main: #f4ecd8;
      --panel-bg: #eae0c8;
      --text-main: #42321e;
      --text-muted: #7d674c;
      --border: #d4c4a8;
      --accent: #b45309;
      --accent-active: #92400e;
      --highlight: rgba(217, 119, 6, 0.25);
      --highlight-border: #d97706;
      --tab-active-bg: #dfceb0;
    }

    [data-theme="dark"] {
      --bg-main: #0b1120;
      --panel-bg: #151e32;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #23314e;
      --accent: #38bdf8;
      --accent-active: #0284c7;
      --highlight: rgba(56, 189, 248, 0.22);
      --highlight-border: #38bdf8;
      --tab-active-bg: #1e293b;
    }

    [data-theme="oled"] {
      --bg-main: #000000;
      --panel-bg: #0d0d0d;
      --text-main: #ededed;
      --text-muted: #737373;
      --border: #262626;
      --accent: #10b981;
      --accent-active: #059669;
      --highlight: rgba(16, 185, 129, 0.22);
      --highlight-border: #10b981;
      --tab-active-bg: #222222;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color var(--transition), color var(--transition);
    }

    /* TOP HEADER */
    header {
      padding: 0.85rem 2rem;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--text-main);
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      color: var(--accent);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    button, select, label.btn-ui, input[type="number"] {
      background: var(--bg-main);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--font-ui);
      transition: border-color var(--transition);
    }

    button:hover, select:hover, label.btn-ui:hover { border-color: var(--accent); }
    button.primary {
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 600;
    }
    button.primary:hover { background: var(--accent-active); }

    /* ENGINE & VOICE CONTROLS */
    .controls-panel {
      max-width: 860px;
      width: 100%;
      margin: 1.5rem auto 0;
      padding: 1rem 1.5rem;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .engine-tabs-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .engine-tab {
      background: var(--bg-main);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.45rem 0.9rem;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
    }

    .engine-tab:hover {
      color: var(--text-main);
      border-color: var(--accent);
    }

    .engine-tab.active {
      background: var(--tab-active-bg);
      color: var(--text-main);
      border-color: var(--accent);
      font-weight: 600;
      box-shadow: 0 0 0 1px var(--accent);
    }

    .settings-sub-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
      flex-wrap: wrap;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .setting-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .slider-container input[type="range"] {
      width: 90px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* READING AREA */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
    }

    .reader-card {
      max-width: 860px;
      width: 100%;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3.5rem 3rem;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 480px;
      margin-top: 1rem;
    }

    .book-content {
      font-family: var(--font-reader);
      font-size: 1.3rem;
      line-height: 2.2;
      letter-spacing: 0.01rem;
      user-select: text;
    }

    /* SOFT HIGHLIGHT (NO UNDERLINE) */
    .sentence {
      padding: 2px 4px;
      border-radius: 4px;
      transition: background-color 0.2s ease;
      cursor: pointer;
      text-decoration: none !important;
    }

    .sentence:hover {
      background-color: rgba(255, 255, 255, 0.04);
      text-decoration: none !important;
    }

    .sentence.active-sentence {
      background-color: var(--highlight) !important;
      box-shadow: 0 0 0 2px var(--highlight-border);
      border-radius: 4px;
      color: inherit;
      text-decoration: none !important;
    }

    /* FOOTER & CLEAN PAGE SELECTOR */
    .footer-bar {
      margin-top: 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }

    .page-nav {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Remove browser arrows and center page number cleanly */
    .page-jump-input::-webkit-outer-spin-button,
    .page-jump-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .page-jump-input {
      -moz-appearance: textfield;
      appearance: textfield;
      width: 72px;
      min-width: 72px;
      padding: 0.35rem 0.5rem;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
      line-height: 1.2;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand-group">
      <!-- Fitted Minimalist Book & Soundwave Logo -->
      <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
        <path d="M8 7h8"/>
        <path d="M8 11h5"/>
        <path d="M12 17a2 2 0 0 0 2-2v-2a2 2 0 0 0-4 0v2a2 2 0 0 0 2 2Z"/>
      </svg>
      <span class="brand-title">Marginalia</span>
    </div>

    <div class="header-actions">
      <!-- File Picker -->
      <label class="btn-ui" for="fileInput">
        📁 Open Document
      </label>
      <input type="file" id="fileInput" accept=".txt,.md,.pdf,.docx,.epub,.html,.htm" style="display:none;" />

      <!-- Theme Switcher -->
      <select id="themeSelect">
        <option value="light">Clean Light</option>
        <option value="sepia">Sepia Paper</option>
        <option value="dark">Nord Dark</option>
        <option value="oled">OLED Pitch Black</option>
      </select>

      <button id="playBtn" class="primary">▶ Play</button>
      <button id="pauseBtn">⏸ Pause</button>
    </div>
  </header>

  <main>
    <!-- CONTROLS PANEL -->
    <div class="controls-panel">
      <!-- Engine Selector Pills -->
      <div class="engine-tabs-group">
        <button class="engine-tab active" data-engine="browser">Browser / Native</button>
        <button class="engine-tab" data-engine="elevenlabs">ElevenLabs</button>
        <button class="engine-tab" data-engine="openai">OpenAI Audio</button>
        <button class="engine-tab" data-engine="google">Google Cloud</button>
        <button class="engine-tab" data-engine="azure">Azure Speech</button>
      </div>

      <div class="settings-sub-bar">
        <!-- Voice Picker -->
        <div class="setting-group">
          <span>Voice:</span>
          <select id="voicePicker" style="min-width: 190px;"></select>
        </div>

        <!-- Speed Slider -->
        <div class="setting-group">
          <span>Speed:</span>
          <div class="slider-container">
            <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.1" value="1.0" />
            <span id="speedDisplay" style="width: 32px; font-weight: 600; color:var(--text-main);">1.0x</span>
          </div>
        </div>

        <!-- Autoplay -->
        <label class="setting-group" style="cursor:pointer;">
          <input type="checkbox" id="autoFlipCheck" checked style="accent-color: var(--accent);" />
          <span>Auto-turn page</span>
        </label>
      </div>
    </div>

    <!-- READING CANVAS -->
    <div class="reader-card">
      <div id="contentPane" class="book-content"></div>

      <div class="footer-bar">
        <button id="prevPageBtn">← Previous</button>

        <div class="page-nav">
          <span>Page</span>
          <input type="number" id="pageJumpInput" class="page-jump-input" min="1" value="1" />
          <span id="pageTotal">of 1</span>
        </div>

        <button id="nextPageBtn">Next →</button>
      </div>
    </div>
  </main>

  <audio id="neuralAudio" style="display:none;"></audio>

  <script>
    // PRESET ENGINE VOICES
    const voicePresets = {
      browser: [],
      elevenlabs: [
        { id: '21m00Tcm4TlvDq8ikWAM', name: 'Rachel (Calm & Natural)' },
        { id: 'AZnzlk1XvdvUeBnXmlld', name: 'Domi (Empathetic)' },
        { id: 'EXAVITQu4vr4xnSDxMaL', name: 'Bella (Expressive)' },
        { id: 'ErXwobaYiN019PkySvjV', name: 'Antoni (Well-rounded)' },
        { id: 'pNInz6obpgDQGcFmaJgB', name: 'Adam (Deep Baritone)' }
      ],
      openai: [
        { id: 'alloy', name: 'Alloy (Balanced)' },
        { id: 'echo', name: 'Echo (Warm)' },
        { id: 'fable', name: 'Fable (British Accent)' },
        { id: 'onyx', name: 'Onyx (Deep Authoritative)' },
        { id: 'nova', name: 'Nova (Energetic)' },
        { id: 'shimmer', name: 'Shimmer (Clear)' }
      ],
      google: [
        { id: 'en-US-Journey-F', name: 'Journey Female (Natural)' },
        { id: 'en-US-Journey-D', name: 'Journey Male (Deep)' },
        { id: 'en-US-Neural2-F', name: 'Neural2 Female' },
        { id: 'en-US-Neural2-D', name: 'Neural2 Male' }
      ],
      azure: [
        { id: 'en-US-JennyNeural', name: 'Jenny (Neural US)' },
        { id: 'en-US-GuyNeural', name: 'Guy (Neural US)' },
        { id: 'en-GB-SoniaNeural', name: 'Sonia (Neural UK)' }
      ]
    };

    let bookPages = [
      [
        "Welcome to your updated Marginalia reader workspace.",
        "Each reading engine is clickable above, and your voice options populate automatically.",
        "Adjusting the speed slider updates the speed badge in real time.",
        "Text highlights cleanly with a soft highlighter tint and no underlines.",
        "Open any EPUB, PDF, Word, or text file to start reading."
      ]
    ];

    let currentPage = 0;
    let currentSentenceIdx = 0;
    let isPlaying = false;
    let activeEngine = 'browser';
    let playbackSpeed = 1.0;
    const browserSpeech = window.speechSynthesis;
    let currentUtterance = null;
    const audioElement = document.getElementById('neuralAudio');

    // DOM Elements
    const contentPane = document.getElementById('contentPane');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const prevPageBtn = document.getElementById('prevPageBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');
    const pageJumpInput = document.getElementById('pageJumpInput');
    const pageTotal = document.getElementById('pageTotal');
    const autoFlipCheck = document.getElementById('autoFlipCheck');
    const themeSelect = document.getElementById('themeSelect');
    const voicePicker = document.getElementById('voicePicker');
    const speedSlider = document.getElementById('speedSlider');
    const speedDisplay = document.getElementById('speedDisplay');
    const fileInput = document.getElementById('fileInput');

    // --- POPULATE VOICES ---
    function populateVoices() {
      voicePicker.innerHTML = '';

      if (activeEngine === 'browser') {
        const voices = browserSpeech.getVoices();
        if (!voices || voices.length === 0) {
          const opt = document.createElement('option');
          opt.value = "";
          opt.textContent = "Loading system voices...";
          voicePicker.appendChild(opt);
          return;
        }
        voices.forEach((v, idx) => {
          const opt = document.createElement('option');
          opt.value = idx;
          opt.textContent = `${v.name} (${v.lang})`;
          voicePicker.appendChild(opt);
        });
      } else {
        const list = voicePresets[activeEngine] || [];
        list.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item.id;
          opt.textContent = item.name;
          voicePicker.appendChild(opt);
        });
      }
    }

    if (typeof speechSynthesis !== 'undefined') {
      speechSynthesis.onvoiceschanged = () => {
        if (activeEngine === 'browser') populateVoices();
      };
    }
    setTimeout(() => {
      if (activeEngine === 'browser') populateVoices();
    }, 250);

    // --- ENGINE SELECTION ---
    document.querySelectorAll('.engine-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.engine-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeEngine = tab.dataset.engine;
        populateVoices();

        if (isPlaying) {
          stopAudio();
          isPlaying = true;
          playCurrentSentence();
        }
      });
    });

    // --- SPEED CONTROL ---
    speedSlider.addEventListener('input', (e) => {
      playbackSpeed = parseFloat(e.target.value);
      speedDisplay.textContent = `${playbackSpeed.toFixed(1)}x`;

      if (isPlaying) {
        if (activeEngine === 'browser') {
          browserSpeech.cancel();
          playCurrentSentence();
        } else {
          audioElement.playbackRate = playbackSpeed;
        }
      }
    });

    // --- SENTENCE SEGMENTER ---
    function splitIntoSentences(text) {
      if (!text || !text.trim()) return [];

      if (typeof Intl !== 'undefined' && Intl.Segmenter) {
        try {
          const segmenter = new Intl.Segmenter('en', { granularity: 'sentence' });
          const segments = Array.from(segmenter.segment(text));
          const sentences = segments
            .map(s => s.segment.replace(/\s+/g, ' ').trim())
            .filter(s => s.length > 0);
          if (sentences.length > 0) return sentences;
        } catch (e) {
          console.warn("Intl.Segmenter fallback:", e);
        }
      }

      const rawSentences = text
        .replace(/([.?!]+)(\s+)/g, "$1\n---BREAK---\n")
        .split("\n---BREAK---\n");

      let cleaned = rawSentences
        .map(s => s.replace(/\s+/g, ' ').trim())
        .filter(s => s.length > 0);

      if (cleaned.length === 0 && text.trim().length > 0) {
        const words = text.trim().replace(/\s+/g, ' ').split(' ');
        cleaned = [];
        for (let i = 0; i < words.length; i += 25) {
          cleaned.push(words.slice(i, i + 25).join(' '));
        }
      }
      return cleaned;
    }

    // --- FILE PARSER ---
    fileInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      stopAudio();
      contentPane.innerHTML = `<div style="text-align:center; padding:3rem; color:var(--text-muted); font-style:italic;">Processing document: ${file.name}...</div>`;

      try {
        const ext = file.name.split('.').pop().toLowerCase();
        let extractedText = "";

        if (ext === 'txt' || ext === 'md') {
          extractedText = await file.text();
        } 
        else if (ext === 'html' || ext === 'htm') {
          const raw = await file.text();
          const doc = new DOMParser().parseFromString(raw, 'text/html');
          extractedText = (doc.body ? doc.body.textContent : doc.documentElement.textContent) || raw.replace(/<[^>]+>/g, ' ');
        } 
        else if (ext === 'docx') {
          const buf = await file.arrayBuffer();
          const res = await mammoth.extractRawText({ arrayBuffer: buf });
          extractedText = res.value || "";
        } 
        else if (ext === 'pdf') {
          const buf = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
          let pages = [];
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            const pageStr = content.items.map(it => it.str).join(' ');
            if (pageStr.trim()) pages.push(pageStr.trim());
          }
          extractedText = pages.join('\n\n');

          if (!extractedText.trim()) {
            throw new Error("This PDF appears to be a scanned image or has no selectable digital text.");
          }
        } 
        else if (ext === 'epub') {
          const buf = await file.arrayBuffer();
          const zip = await JSZip.loadAsync(buf);

          const fileNames = Object.keys(zip.files).filter(name => {
            const lower = name.toLowerCase();
            return (lower.endsWith('.xhtml') || lower.endsWith('.html') || lower.endsWith('.htm')) &&
                   !lower.includes('toc') &&
                   !lower.endsWith('.ncx');
          }).sort();

          let chapters = [];
          for (const name of fileNames) {
            const rawHtml = await zip.files[name].async("text");
            const doc = new DOMParser().parseFromString(rawHtml, 'text/html');
            const text = (doc.body ? doc.body.textContent : doc.documentElement.textContent) || '';
            const clean = text.replace(/\s+/g, ' ').trim();
            if (clean.length > 25) {
              chapters.push(clean);
            }
          }

          if (chapters.length === 0) {
            for (const name of Object.keys(zip.files)) {
              if (/\.(xhtml|html|htm|txt|xml)$/i.test(name) && !name.includes('META-INF')) {
                const raw = await zip.files[name].async("text");
                const stripped = raw.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
                if (stripped.length > 50) chapters.push(stripped);
              }
            }
          }
          extractedText = chapters.join('\n\n');
        }

        const sentences = splitIntoSentences(extractedText);
        if (sentences.length === 0) {
          throw new Error("No readable text detected in this document.");
        }

        bookPages = [];
        const perPage = 5;
        for (let i = 0; i < sentences.length; i += perPage) {
          bookPages.push(sentences.slice(i, i + perPage));
        }

        currentPage = 0;
        currentSentenceIdx = 0;
        renderPage(0);
      } catch (err) {
        alert("Failed to parse file: " + err.message);
        renderPage(currentPage);
      }
    });

    // --- PAGE RENDERING ---
    function renderPage(idx) {
      contentPane.innerHTML = '';
      const sentences = bookPages[idx] || [];

      sentences.forEach((txt, sIdx) => {
        const span = document.createElement('span');
        span.className = 'sentence';
        span.id = `sent-${sIdx}`;
        span.textContent = txt + ' ';
        span.addEventListener('click', () => {
          currentSentenceIdx = sIdx;
          if (isPlaying) {
            stopAudio();
            isPlaying = true;
            playCurrentSentence();
          } else {
            highlightActiveSentence();
          }
        });
        contentPane.appendChild(span);
      });

      pageJumpInput.value = idx + 1;
      pageTotal.textContent = `of ${bookPages.length}`;
      prevPageBtn.disabled = idx === 0;
      nextPageBtn.disabled = idx >= bookPages.length - 1;
      highlightActiveSentence();
    }

    function highlightActiveSentence() {
      document.querySelectorAll('.sentence').forEach(el => el.classList.remove('active-sentence'));
      const target = document.getElementById(`sent-${currentSentenceIdx}`);
      if (target) {
        target.classList.add('active-sentence');
        target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    pageJumpInput.addEventListener('change', (e) => {
      let pageNum = parseInt(e.target.value, 10);
      if (isNaN(pageNum) || pageNum < 1) pageNum = 1;
      if (pageNum > bookPages.length) pageNum = bookPages.length;

      currentPage = pageNum - 1;
      currentSentenceIdx = 0;
      const wasPlaying = isPlaying;
      stopAudio();
      renderPage(currentPage);
      if (wasPlaying) {
        isPlaying = true;
        playCurrentSentence();
      }
    });

    // --- PLAYBACK ENGINE ---
    async function playCurrentSentence() {
      const pageSentences = bookPages[currentPage];
      if (!pageSentences || pageSentences.length === 0) return;

      if (currentSentenceIdx >= pageSentences.length) {
        if (autoFlipCheck.checked && currentPage < bookPages.length - 1) {
          currentPage++;
          currentSentenceIdx = 0;
          renderPage(currentPage);
          playCurrentSentence();
        } else {
          stopAudio();
        }
        return;
      }

      highlightActiveSentence();
      const textToRead = pageSentences[currentSentenceIdx];

      if (activeEngine === 'browser') {
        speakBrowser(textToRead);
      } else {
        await speakServerless(textToRead);
      }
    }

    function speakBrowser(text) {
      browserSpeech.cancel();
      currentUtterance = new SpeechSynthesisUtterance(text);
      currentUtterance.rate = playbackSpeed;

      const voices = browserSpeech.getVoices();
      if (voices.length > 0 && voicePicker.value !== "") {
        currentUtterance.voice = voices[parseInt(voicePicker.value, 10)] || voices[0];
      }

      currentUtterance.onend = () => {
        if (!isPlaying) return;
        currentSentenceIdx++;
        playCurrentSentence();
      };

      currentUtterance.onerror = () => stopAudio();
      browserSpeech.speak(currentUtterance);
    }

    async function speakServerless(text) {
      try {
        const token = localStorage.getItem('sb_access_token') || '';
        const res = await fetch('/api/tts', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            text: text,
            voiceId: voicePicker.value,
            engine: activeEngine,
            speed: playbackSpeed
          })
        });

        if (res.status === 402) {
          alert("Neural character quota reached. Switching to browser engine.");
          document.querySelector('[data-engine="browser"]').click();
          return;
        }

        if (!res.ok) throw new Error(`Status ${res.status}`);
        const data = await res.json();
        const src = data.audio_base64 
          ? `data:audio/mp3;base64,${data.audio_base64}`
          : (data.audioUrl || '');

        audioElement.src = src;
        audioElement.playbackRate = playbackSpeed;
        audioElement.play();

        audioElement.onended = () => {
          if (!isPlaying) return;
          currentSentenceIdx++;
          playCurrentSentence();
        };
      } catch (err) {
        console.warn("Neural proxy unavailable, falling back to browser voice:", err);
        speakBrowser(text);
      }
    }

    function stopAudio() {
      isPlaying = false;
      browserSpeech.cancel();
      audioElement.pause();
      audioElement.currentTime = 0;
    }

    // --- CONTROLS SETUP ---
    playBtn.addEventListener('click', () => {
      isPlaying = true;
      playCurrentSentence();
    });

    pauseBtn.addEventListener('click', stopAudio);

    prevPageBtn.addEventListener('click', () => {
      if (currentPage > 0) {
        currentPage--;
        currentSentenceIdx = 0;
        const wasPlaying = isPlaying;
        stopAudio();
        renderPage(currentPage);
        if (wasPlaying) {
          isPlaying = true;
          playCurrentSentence();
        }
      }
    });

    nextPageBtn.addEventListener('click', () => {
      if (currentPage < bookPages.length - 1) {
        currentPage++;
        currentSentenceIdx = 0;
        const wasPlaying = isPlaying;
        stopAudio();
        renderPage(currentPage);
        if (wasPlaying) {
          isPlaying = true;
          playCurrentSentence();
        }
      }
    });

    themeSelect.addEventListener('change', (e) => {
      document.documentElement.setAttribute('data-theme', e.target.value);
      localStorage.setItem('marginalia_theme', e.target.value);
    });

    // Initialize
    const savedTheme = localStorage.getItem('marginalia_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeSelect.value = savedTheme;

    populateVoices();
    renderPage(0);
  </script>
</body>
</html>
