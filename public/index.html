<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marginalia — Read-Along Reader</title>
  <style>
    :root {
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
      --transition: 0.25s ease;
    }

    /* THEMES DEFINITION */
    [data-theme="light"] {
      --bg-color: #f8fafc;
      --panel-bg: #ffffff;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent-color: #2563eb;
      --highlight-bg: #fef08a;
      --highlight-text: #000000;
    }

    [data-theme="sepia"] {
      --bg-color: #f4ecd8;
      --panel-bg: #eadeca;
      --text-color: #433422;
      --text-muted: #7f6a52;
      --border-color: #d8c8b0;
      --accent-color: #8b5a2b;
      --highlight-bg: #d4a373;
      --highlight-text: #ffffff;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --text-color: #f1f5f9;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent-color: #38bdf8;
      --highlight-bg: #0284c7;
      --highlight-text: #ffffff;
    }

    [data-theme="oled"] {
      --bg-color: #000000;
      --panel-bg: #111111;
      --text-color: #ededed;
      --text-muted: #777777;
      --border-color: #222222;
      --accent-color: #10b981;
      --highlight-bg: #059669;
      --highlight-text: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color var(--transition), color var(--transition);
    }

    header {
      padding: 1rem 2rem;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand { font-weight: 700; font-size: 1.25rem; letter-spacing: -0.5px; }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    select, button {
      background: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
    }

    button:hover, select:hover { border-color: var(--accent-color); }
    button.primary {
      background: var(--accent-color);
      color: #fff;
      border: none;
      font-weight: 600;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 2.5rem 1rem;
    }

    .reader-card {
      max-width: 760px;
      width: 100%;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 3rem 2.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .book-content {
      font-size: 1.25rem;
      line-height: 2;
      user-select: text;
    }

    .sentence {
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      transition: background-color 0.15s ease;
    }
    .sentence:hover {
      text-decoration: underline;
    }
    .sentence.active-sentence {
      background-color: var(--highlight-bg);
      color: var(--highlight-text);
      font-weight: 500;
    }

    .footer-bar {
      margin-top: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 1.5rem;
    }

    .page-indicator {
      font-size: 0.9rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">Marginalia</div>

    <div class="controls-row">
      <!-- Theme Selection -->
      <label for="themeSelect">Theme:</label>
      <select id="themeSelect">
        <option value="light">Clean Light</option>
        <option value="sepia">Sepia Book</option>
        <option value="dark">Nord Dark</option>
        <option value="oled">OLED Pitch Black</option>
      </select>

      <!-- Engine Picker -->
      <label for="engineSelect">Voice:</label>
      <select id="engineSelect">
        <option value="browser">Free Native Engine</option>
        <option value="neural">Cloud Neural (Serverless)</option>
      </select>

      <!-- Autoplay Toggle -->
      <label style="display:flex; align-items:center; gap:0.3rem; font-size:0.9rem; cursor:pointer;">
        <input type="checkbox" id="autoFlipCheck" checked />
        Auto-turn page
      </label>

      <button id="playBtn" class="primary">▶ Play</button>
      <button id="pauseBtn">⏸ Pause</button>
    </div>
  </header>

  <main>
    <div class="reader-card">
      <div id="contentPane" class="book-content"></div>

      <div class="footer-bar">
        <button id="prevPageBtn">← Previous Page</button>
        <span id="pageIndicator" class="page-indicator">Page 1 of 3</span>
        <button id="nextPageBtn">Next Page →</button>
      </div>
    </div>
  </main>

  <audio id="neuralAudio" style="display:none;"></audio>

  <script>
    // Sample Book Data Structure
    const bookPages = [
      [
        "Welcome to the high-performance read-along experience.",
        "This reader handles continuous synthesis across arbitrary documents.",
        "When the speech player finishes this paragraph, it will automatically advance the page.",
        "You do not need to pause or touch the screen to keep listening."
      ],
      [
        "You are now on page two.",
        "Notice how the reader kept playing seamlessly without interruption.",
        "You can switch between Sepia, Light, Dark, or OLED themes anytime in the top bar.",
        "All visual settings persist even if you reload the page."
      ],
      [
        "This is the third and final page in this demo chapter.",
        "Once this final sentence ends, the audio will complete smoothly.",
        "You can tap on any individual sentence directly to jump the reading position."
      ]
    ];

    let currentPage = 0;
    let currentSentenceIdx = 0;
    let isPlaying = false;
    let browserSpeech = window.speechSynthesis;
    let currentUtterance = null;
    const audioElement = document.getElementById('neuralAudio');

    // DOM References
    const contentPane = document.getElementById('contentPane');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');
    const prevPageBtn = document.getElementById('prevPageBtn');
    const pageIndicator = document.getElementById('pageIndicator');
    const autoFlipCheck = document.getElementById('autoFlipCheck');
    const themeSelect = document.getElementById('themeSelect');
    const engineSelect = document.getElementById('engineSelect');

    // --- THEME MANAGEMENT ---
    function initTheme() {
      const savedTheme = localStorage.getItem('marginalia_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      themeSelect.value = savedTheme;

      themeSelect.addEventListener('change', (e) => {
        const selected = e.target.value;
        document.documentElement.setAttribute('data-theme', selected);
        localStorage.setItem('marginalia_theme', selected);
      });
    }

    // --- PAGE RENDERING ---
    function renderPage(pageIdx) {
      contentPane.innerHTML = '';
      const sentences = bookPages[pageIdx];

      sentences.forEach((txt, idx) => {
        const span = document.createElement('span');
        span.className = 'sentence';
        span.id = `sent-${idx}`;
        span.textContent = txt + ' ';
        span.addEventListener('click', () => {
          currentSentenceIdx = idx;
          if (isPlaying) {
            stopAudio();
            playCurrentSentence();
          } else {
            updateSentenceHighlight();
          }
        });
        contentPane.appendChild(span);
      });

      pageIndicator.textContent = `Page ${pageIdx + 1} of ${bookPages.length}`;
      prevPageBtn.disabled = pageIdx === 0;
      nextPageBtn.disabled = pageIdx === bookPages.length - 1;
      updateSentenceHighlight();
    }

    function updateSentenceHighlight() {
      document.querySelectorAll('.sentence').forEach(el => el.classList.remove('active-sentence'));
      const activeEl = document.getElementById(`sent-${currentSentenceIdx}`);
      if (activeEl) {
        activeEl.classList.add('active-sentence');
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    // --- PLAYBACK ENGINE ---
    async function playCurrentSentence() {
      const pageSentences = bookPages[currentPage];

      // End of Page Condition
      if (currentSentenceIdx >= pageSentences.length) {
        if (autoFlipCheck.checked && currentPage < bookPages.length - 1) {
          currentPage++;
          currentSentenceIdx = 0;
          renderPage(currentPage);
          playCurrentSentence();
        } else {
          stopAudio();
        }
        return;
      }

      updateSentenceHighlight();
      const textToRead = pageSentences[currentSentenceIdx];
      const selectedEngine = engineSelect.value;

      if (selectedEngine === 'browser') {
        speakNative(textToRead);
      } else {
        await speakNeural(textToRead);
      }
    }

    function speakNative(text) {
      browserSpeech.cancel();
      currentUtterance = new SpeechSynthesisUtterance(text);
      currentUtterance.rate = 1.0;

      currentUtterance.onend = () => {
        if (!isPlaying) return;
        currentSentenceIdx++;
        playCurrentSentence();
      };

      currentUtterance.onerror = (e) => {
        console.error("Browser speech error:", e);
        stopAudio();
      };

      browserSpeech.speak(currentUtterance);
    }

    async function speakNeural(text) {
      try {
        const token = localStorage.getItem('sb_access_token') || '';

        const res = await fetch('/api/tts', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            text: text,
            voiceId: '21m00Tcm4TlvDq8ikWAM', // Standard ElevenLabs Rachel
            engine: 'elevenlabs'
          })
        });

        if (res.status === 402) {
          alert("Neural credits exhausted. Swapped to native engine.");
          engineSelect.value = 'browser';
          speakNative(text);
          return;
        }

        if (!res.ok) throw new Error(`Proxy error ${res.status}`);
        const data = await res.json();

        // Support base64 payloads
        const audioSrc = data.audio_base64 
          ? `data:audio/mp3;base64,${data.audio_base64}`
          : (data.audioUrl || '');

        audioElement.src = audioSrc;
        audioElement.play();

        audioElement.onended = () => {
          if (!isPlaying) return;
          currentSentenceIdx++;
          playCurrentSentence();
        };

      } catch (err) {
        console.warn("Neural backend unavailable, falling back to local voice:", err);
        speakNative(text);
      }
    }

    function stopAudio() {
      isPlaying = false;
      browserSpeech.cancel();
      audioElement.pause();
      audioElement.currentTime = 0;
    }

    // --- EVENT HANDLERS ---
    playBtn.addEventListener('click', () => {
      isPlaying = true;
      playCurrentSentence();
    });

    pauseBtn.addEventListener('click', () => {
      stopAudio();
    });

    nextPageBtn.addEventListener('click', () => {
      if (currentPage < bookPages.length - 1) {
        currentPage++;
        currentSentenceIdx = 0;
        const wasPlaying = isPlaying;
        stopAudio();
        renderPage(currentPage);
        if (wasPlaying) {
          isPlaying = true;
          playCurrentSentence();
        }
      }
    });

    prevPageBtn.addEventListener('click', () => {
      if (currentPage > 0) {
        currentPage--;
        currentSentenceIdx = 0;
        const wasPlaying = isPlaying;
        stopAudio();
        renderPage(currentPage);
        if (wasPlaying) {
          isPlaying = true;
          playCurrentSentence();
        }
      }
    });

    // --- INIT ---
    initTheme();
    renderPage(currentPage);
  </script>
</body>
</html>
