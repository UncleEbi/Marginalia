<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marginalia — Commercial Read-Along Platform</title>

  <!-- Client-Side Document Parsers -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <style>
    :root {
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-reader: "Georgia", "Merriweather", "Charter", serif;
      --transition: 0.2s ease;
    }

    [data-theme="light"] {
      --bg-main: #f8fafc;
      --panel-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent-active: #1d4ed8;
      --highlight: rgba(254, 215, 10, 0.35);
      --highlight-border: #f59e0b;
      --word-active: #0284c7;
      --word-text: #ffffff;
      --tab-active-bg: #f1f5f9;
      --modal-overlay: rgba(15, 23, 42, 0.4);
    }

    [data-theme="sepia"] {
      --bg-main: #f4ecd8;
      --panel-bg: #eae0c8;
      --text-main: #42321e;
      --text-muted: #7d674c;
      --border: #d4c4a8;
      --accent: #b45309;
      --accent-active: #92400e;
      --highlight: rgba(217, 119, 6, 0.22);
      --highlight-border: #d97706;
      --word-active: #78350f;
      --word-text: #ffffff;
      --tab-active-bg: #dfceb0;
      --modal-overlay: rgba(66, 50, 30, 0.45);
    }

    [data-theme="dark"] {
      --bg-main: #0b1120;
      --panel-bg: #151e32;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #23314e;
      --accent: #38bdf8;
      --accent-active: #0284c7;
      --highlight: rgba(56, 189, 248, 0.16);
      --highlight-border: #0284c7;
      --word-active: #38bdf8;
      --word-text: #0b1120;
      --tab-active-bg: #1e293b;
      --modal-overlay: rgba(0, 0, 0, 0.65);
    }

    [data-theme="oled"] {
      --bg-main: #000000;
      --panel-bg: #0d0d0d;
      --text-main: #ededed;
      --text-muted: #737373;
      --border: #262626;
      --accent: #10b981;
      --accent-active: #059669;
      --highlight: rgba(16, 185, 129, 0.18);
      --highlight-border: #10b981;
      --word-active: #10b981;
      --word-text: #000000;
      --tab-active-bg: #222222;
      --modal-overlay: rgba(0, 0, 0, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color var(--transition), color var(--transition);
    }

    /* TOP HEADER */
    header {
      padding: 0.85rem 2rem;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-main);
      user-select: none;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      color: var(--accent);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    button, select, label.btn-ui, input[type="number"] {
      background: var(--bg-main);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--font-ui);
      transition: border-color var(--transition);
    }

    button:hover, select:hover, label.btn-ui:hover { border-color: var(--accent); }
    button.primary {
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 600;
    }
    button.primary:hover { background: var(--accent-active); }

    /* AUTH & CREDITS BADGE */
    .credit-badge {
      font-size: 0.8rem;
      padding: 0.4rem 0.75rem;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--border);
      color: var(--accent);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
    }

    /* CONTROL PANEL */
    .controls-panel {
      max-width: 860px;
      width: 100%;
      margin: 1.25rem auto 0;
      padding: 1rem 1.5rem;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .engine-tabs-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .engine-tab {
      background: var(--bg-main);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.45rem 0.9rem;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
    }

    .engine-tab:hover {
      color: var(--text-main);
      border-color: var(--accent);
    }

    .engine-tab.active {
      background: var(--tab-active-bg);
      color: var(--text-main);
      border-color: var(--accent);
      font-weight: 600;
      box-shadow: 0 0 0 1px var(--accent);
    }

    .settings-sub-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
      flex-wrap: wrap;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .setting-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .slider-container input[type="range"] {
      width: 85px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* READING CANVAS */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 1rem 3rem;
    }

    .reader-card {
      max-width: 860px;
      width: 100%;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3.5rem 3rem;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 480px;
      margin-top: 1rem;
      position: relative;
    }

    .doc-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
    }

    .book-content {
      font-family: var(--font-reader);
      font-size: 1.32rem;
      line-height: 2.2;
      letter-spacing: 0.01rem;
      user-select: text;
    }

    /* KARAOKE & HIGHLIGHTING */
    .sentence {
      padding: 2px 4px;
      border-radius: 4px;
      transition: background-color 0.2s ease;
      cursor: pointer;
      text-decoration: none !important;
    }

    .sentence:hover {
      background-color: rgba(255, 255, 255, 0.04);
    }

    .sentence.active-sentence {
      background-color: var(--highlight) !important;
      box-shadow: 0 0 0 1px var(--highlight-border);
      border-radius: 4px;
    }

    .word {
      display: inline-block;
      border-radius: 3px;
      padding: 0 1px;
      transition: background-color 0.08s ease, color 0.08s ease;
    }

    .word.active-word {
      background-color: var(--word-active);
      color: var(--word-text) !important;
      font-weight: 600;
    }

    /* FOOTER */
    .footer-bar {
      margin-top: 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }

    .page-nav {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .page-jump-input::-webkit-outer-spin-button,
    .page-jump-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .page-jump-input {
      -moz-appearance: textfield;
      appearance: textfield;
      width: 72px;
      min-width: 72px;
      padding: 0.35rem 0.5rem;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
      line-height: 1.2;
      border-radius: 6px;
    }

    /* AUTH MODAL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--modal-overlay);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 380px;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .input-field {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-main);
      color: var(--text-main);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand-group">
      <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
        <path d="M8 7h8"/>
        <path d="M8 11h5"/>
        <path d="M12 17a2 2 0 0 0 2-2v-2a2 2 0 0 0-4 0v2a2 2 0 0 0 2 2Z"/>
      </svg>
      <span class="brand-title">Marginalia</span>
    </div>

    <div class="header-actions">
      <!-- Live Credit Ledger Pill -->
      <div id="creditBadge" class="credit-badge">
        <span>⚡</span> <span id="creditDisplay">Sign In</span>
      </div>

      <!-- File Picker -->
      <label class="btn-ui" for="fileInput">
        📁 Open Document
      </label>
      <input type="file" id="fileInput" accept=".txt,.md,.pdf,.docx,.epub,.html,.htm" style="display:none;" />

      <!-- Theme Switcher -->
      <select id="themeSelect">
        <option value="light">Clean Light</option>
        <option value="sepia">Sepia Paper</option>
        <option value="dark">Nord Dark</option>
        <option value="oled">OLED Pitch Black</option>
      </select>

      <button id="playBtn" class="primary">▶ Play</button>
      <button id="pauseBtn">⏸ Pause</button>
    </div>
  </header>

  <main>
    <!-- CONTROLS PANEL -->
    <div class="controls-panel">
      <!-- Voice Engines -->
      <div class="engine-tabs-group">
        <button class="engine-tab active" data-engine="browser">Browser / Native</button>
        <button class="engine-tab" data-engine="elevenlabs">ElevenLabs</button>
        <button class="engine-tab" data-engine="openai">OpenAI Audio</button>
        <button class="engine-tab" data-engine="google">Google Cloud</button>
        <button class="engine-tab" data-engine="azure">Azure Speech</button>
      </div>

      <div class="settings-sub-bar">
        <div class="setting-group">
          <span>Voice:</span>
          <select id="voicePicker" style="min-width: 190px;"></select>
        </div>

        <div class="setting-group">
          <span>Speed:</span>
          <div class="slider-container">
            <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.1" value="1.0" />
            <span id="speedDisplay" style="width: 32px; font-weight: 600; color:var(--text-main);">1.0x</span>
          </div>
        </div>

        <label class="setting-group" style="cursor:pointer;">
          <input type="checkbox" id="autoFlipCheck" checked style="accent-color: var(--accent);" />
          <span>Auto-turn page</span>
        </label>
      </div>
    </div>

    <!-- MAIN READING CANVAS -->
    <div class="reader-card">
      <div class="doc-meta">
        <span id="docTitle">Marginalia Reader</span>
        <span id="preloadStatus">Buffer Ready</span>
      </div>

      <div id="contentPane" class="book-content"></div>

      <div class="footer-bar">
        <button id="prevPageBtn">← Previous</button>

        <div class="page-nav">
          <span>Page</span>
          <input type="number" id="pageJumpInput" class="page-jump-input" min="1" value="1" />
          <span id="pageTotal">of 1</span>
        </div>

        <button id="nextPageBtn">Next →</button>
      </div>
    </div>
  </main>

  <!-- AUTH MODAL -->
  <div id="authModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-title">Account & Quota Access</div>
      <p style="font-size:0.85rem; color:var(--text-muted);">Log in to sync neural character allowances across devices.</p>
      <input type="email" id="authEmail" class="input-field" placeholder="Email address" />
      <input type="password" id="authPass" class="input-field" placeholder="Password" />
      <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
        <button id="authCloseBtn">Cancel</button>
        <button id="authSignUpBtn">Sign Up</button>
        <button id="authSignInBtn" class="primary">Sign In</button>
      </div>
    </div>
  </div>

  <audio id="neuralAudio" style="display:none;"></audio>

  <script>
    // --- SUPABASE CONFIGURATION ---
    // If you wish to hardcode public credentials for your instance, paste them here:
    const SUPABASE_PROJECT_URL = "https://your-project.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_or_anon_key";

    let supabaseClient = null;
    let currentUserSession = null;

    if (SUPABASE_PROJECT_URL && !SUPABASE_PROJECT_URL.includes("your-project")) {
      try {
        supabaseClient = supabase.createClient(SUPABASE_PROJECT_URL, SUPABASE_ANON_KEY);
      } catch (err) {
        console.warn("Supabase initialization bypassed:", err);
      }
    }

    // --- ENGINE PRESETS ---
    const voicePresets = {
      browser: [],
      elevenlabs: [
        { id: '21m00Tcm4TlvDq8ikWAM', name: 'Rachel (Calm & Natural)' },
        { id: 'AZnzlk1XvdvUeBnXmlld', name: 'Domi (Empathetic)' },
        { id: 'EXAVITQu4vr4xnSDxMaL', name: 'Bella (Expressive)' },
        { id: 'ErXwobaYiN019PkySvjV', name: 'Antoni (Well-rounded)' },
        { id: 'pNInz6obpgDQGcFmaJgB', name: 'Adam (Deep Baritone)' }
      ],
      openai: [
        { id: 'alloy', name: 'Alloy (Balanced)' },
        { id: 'echo', name: 'Echo (Warm)' },
        { id: 'fable', name: 'Fable (British Accent)' },
        { id: 'onyx', name: 'Onyx (Deep Authoritative)' },
        { id: 'nova', name: 'Nova (Energetic)' },
        { id: 'shimmer', name: 'Shimmer (Clear)' }
      ],
      google: [
        { id: 'en-US-Journey-F', name: 'Journey Female (Natural)' },
        { id: 'en-US-Journey-D', name: 'Journey Male (Deep)' },
        { id: 'en-US-Neural2-F', name: 'Neural2 Female' }
      ],
      azure: [
        { id: 'en-US-JennyNeural', name: 'Jenny (Neural US)' },
        { id: 'en-US-GuyNeural', name: 'Guy (Neural US)' },
        { id: 'en-GB-SoniaNeural', name: 'Sonia (Neural UK)' }
      ]
    };

    // --- APPLICATION STATE ---
    let currentDocName = "Marginalia Quickstart";
    let bookPages = [
      [
        "Welcome to the commercial-grade Marginalia reading engine.",
        "Audio pre-buffers automatically so playback transitions between sentences without gaps.",
        "Karaoke tracking highlights individual words in sync with the speaker.",
        "Your reading progress and playback settings save automatically to your browser.",
        "Try locking your device screen: background audio and lock screen controls stay active."
      ]
    ];

    let currentPage = 0;
    let currentSentenceIdx = 0;
    let isPlaying = false;
    let activeEngine = 'browser';
    let playbackSpeed = 1.0;
    const browserSpeech = window.speechSynthesis;
    let currentUtterance = null;
    const audioElement = document.getElementById('neuralAudio');

    // Pre-buffering storage cache
    const audioPreloadCache = new Map();

    // DOM References
    const contentPane = document.getElementById('contentPane');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const prevPageBtn = document.getElementById('prevPageBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');
    const pageJumpInput = document.getElementById('pageJumpInput');
    const pageTotal = document.getElementById('pageTotal');
    const autoFlipCheck = document.getElementById('autoFlipCheck');
    const themeSelect = document.getElementById('themeSelect');
    const voicePicker = document.getElementById('voicePicker');
    const speedSlider = document.getElementById('speedSlider');
    const speedDisplay = document.getElementById('speedDisplay');
    const fileInput = document.getElementById('fileInput');
    const docTitle = document.getElementById('docTitle');
    const preloadStatus = document.getElementById('preloadStatus');
    const creditBadge = document.getElementById('creditBadge');
    const creditDisplay = document.getElementById('creditDisplay');
    const authModal = document.getElementById('authModal');
    const authEmail = document.getElementById('authEmail');
    const authPass = document.getElementById('authPass');
    const authSignInBtn = document.getElementById('authSignInBtn');
    const authSignUpBtn = document.getElementById('authSignUpBtn');
    const authCloseBtn = document.getElementById('authCloseBtn');

    // --- PROGRESS PERSISTENCE ---
    function saveSessionProgress() {
      const state = {
        docName: currentDocName,
        bookPages: bookPages,
        currentPage: currentPage,
        currentSentenceIdx: currentSentenceIdx,
        speed: playbackSpeed,
        engine: activeEngine,
        theme: document.documentElement.getAttribute('data-theme')
      };
      localStorage.setItem('marginalia_session', JSON.stringify(state));
    }

    function loadSessionProgress() {
      const raw = localStorage.getItem('marginalia_session');
      if (!raw) return false;
      try {
        const state = JSON.parse(raw);
        if (state.bookPages && state.bookPages.length > 0) {
          bookPages = state.bookPages;
          currentPage = state.currentPage || 0;
          currentSentenceIdx = state.currentSentenceIdx || 0;
          currentDocName = state.docName || "Untitled";
          docTitle.textContent = currentDocName;
          if (state.speed) {
            playbackSpeed = state.speed;
            speedSlider.value = state.speed;
            speedDisplay.textContent = `${playbackSpeed.toFixed(1)}x`;
          }
          return true;
        }
      } catch (e) {
        console.warn("Unable to restore session:", e);
      }
      return false;
    }

    // --- ZERO-LATENCY PRE-BUFFERING ENGINE ---
    async function prebufferNextSentence() {
      if (activeEngine === 'browser') return; // Browser native speech engine handles queueing in memory

      let nextSentence = currentSentenceIdx + 1;
      let targetPage = currentPage;

      if (nextSentence >= bookPages[currentPage].length) {
        if (currentPage < bookPages.length - 1) {
          targetPage = currentPage + 1;
          nextSentence = 0;
        } else {
          return; // Document ended
        }
      }

      const text = bookPages[targetPage][nextSentence];
      const cacheKey = `${activeEngine}_${voicePicker.value}_${playbackSpeed}_${text}`;

      if (audioPreloadCache.has(cacheKey)) return;

      preloadStatus.textContent = "Pre-buffering next...";
      try {
        const token = currentUserSession?.access_token || localStorage.getItem('sb_access_token') || '';
        const res = await fetch('/api/tts', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            text: text,
            voiceId: voicePicker.value,
            engine: activeEngine,
            speed: playbackSpeed
          })
        });

        if (res.ok) {
          const data = await res.json();
          const src = data.audio_base64 
            ? `data:audio/mp3;base64,${data.audio_base64}`
            : (data.audioUrl || '');
          
          if (src) {
            const preloadAudio = new Audio();
            preloadAudio.src = src;
            preloadAudio.preload = 'auto';
            audioPreloadCache.set(cacheKey, src);
            preloadStatus.textContent = "Buffer Ready";
          }
        }
      } catch (err) {
        console.warn("Preload error:", err);
        preloadStatus.textContent = "Buffer Idle";
      }
    }

    // --- LOCK SCREEN & MEDIA SESSION API ---
    function syncMediaSession(sentenceText) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: currentDocName,
          artist: `Page ${currentPage + 1} of ${bookPages.length}`,
          album: 'Marginalia Reader',
          artwork: [{ src: 'https://cdn-icons-png.flaticon.com/512/3389/3389024.png', sizes: '512x512', type: 'image/png' }]
        });

        navigator.mediaSession.setActionHandler('play', () => {
          isPlaying = true;
          playCurrentSentence();
        });
        navigator.mediaSession.setActionHandler('pause', stopAudio);
        navigator.mediaSession.setActionHandler('previoustrack', () => {
          if (currentSentenceIdx > 0) currentSentenceIdx--;
          playCurrentSentence();
        });
        navigator.mediaSession.setActionHandler('nexttrack', () => {
          currentSentenceIdx++;
          playCurrentSentence();
        });
      }
    }

    // --- KARAOKE WORD SPLITTER & BUILDER ---
    function buildSentenceDOM(sentenceText, sIdx) {
      const sentenceSpan = document.createElement('span');
      sentenceSpan.className = 'sentence';
      sentenceSpan.id = `sent-${sIdx}`;

      // Tokenize sentence into individual word elements for karaoke highlighting
      const words = sentenceText.split(/(\s+)/);
      let wordCount = 0;

      words.forEach(chunk => {
        if (chunk.trim().length > 0) {
          const wordSpan = document.createElement('span');
          wordSpan.className = 'word';
          wordSpan.id = `w-${sIdx}-${wordCount}`;
          wordSpan.textContent = chunk;
          sentenceSpan.appendChild(wordSpan);
          wordCount++;
        } else {
          sentenceSpan.appendChild(document.createTextNode(chunk));
        }
      });

      sentenceSpan.addEventListener('click', () => {
        currentSentenceIdx = sIdx;
        if (isPlaying) {
          stopAudio();
          isPlaying = true;
          playCurrentSentence();
        } else {
          highlightActiveSentence();
        }
      });

      return sentenceSpan;
    }

    function renderPage(idx) {
      contentPane.innerHTML = '';
      const sentences = bookPages[idx] || [];

      sentences.forEach((txt, sIdx) => {
        contentPane.appendChild(buildSentenceDOM(txt, sIdx));
      });

      pageJumpInput.value = idx + 1;
      pageTotal.textContent = `of ${bookPages.length}`;
      prevPageBtn.disabled = idx === 0;
      nextPageBtn.disabled = idx >= bookPages.length - 1;
      highlightActiveSentence();
      saveSessionProgress();
    }

    function highlightActiveSentence() {
      document.querySelectorAll('.sentence').forEach(el => el.classList.remove('active-sentence'));
      document.querySelectorAll('.word').forEach(el => el.classList.remove('active-word'));

      const target = document.getElementById(`sent-${currentSentenceIdx}`);
      if (target) {
        target.classList.add('active-sentence');
        target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function highlightActiveWord(wIdx) {
      document.querySelectorAll(`#sent-${currentSentenceIdx} .word`).forEach((el, index) => {
        if (index === wIdx) el.classList.add('active-word');
        else el.classList.remove('active-word');
      });
    }

    // --- PLAYBACK ENGINE ---
    async function playCurrentSentence() {
      const pageSentences = bookPages[currentPage];
      if (!pageSentences || pageSentences.length === 0) return;

      if (currentSentenceIdx >= pageSentences.length) {
        if (autoFlipCheck.checked && currentPage < bookPages.length - 1) {
          currentPage++;
          currentSentenceIdx = 0;
          renderPage(currentPage);
          playCurrentSentence();
        } else {
          stopAudio();
        }
        return;
      }

      highlightActiveSentence();
      const textToRead = pageSentences[currentSentenceIdx];
      syncMediaSession(textToRead);
      saveSessionProgress();

      // Trigger pre-buffer for sentence N+1
      prebufferNextSentence();

      if (activeEngine === 'browser') {
        speakBrowser(textToRead);
      } else {
        await speakServerless(textToRead);
      }
    }

    // Browser Speech Synthesis with Word Boundary Hook
    function speakBrowser(text) {
      browserSpeech.cancel();
      currentUtterance = new SpeechSynthesisUtterance(text);
      currentUtterance.rate = playbackSpeed;

      const voices = browserSpeech.getVoices();
      if (voices.length > 0 && voicePicker.value !== "") {
        currentUtterance.voice = voices[parseInt(voicePicker.value, 10)] || voices[0];
      }

      // Karaoke: Track character offsets and highlight matching words
      currentUtterance.onboundary = (e) => {
        if (e.name === 'word') {
          const words = text.slice(0, e.charIndex).trim().split(/\s+/);
          const currentWordIdx = words[0] === "" ? 0 : words.length;
          highlightActiveWord(currentWordIdx);
        }
      };

      currentUtterance.onend = () => {
        if (!isPlaying) return;
        currentSentenceIdx++;
        playCurrentSentence();
      };

      currentUtterance.onerror = () => stopAudio();
      browserSpeech.speak(currentUtterance);
    }

    // Neural Serverless Speech Synthesis with Zero-Latency Cache Injection
    async function speakServerless(text) {
      try {
        const cacheKey = `${activeEngine}_${voicePicker.value}_${playbackSpeed}_${text}`;
        let audioSrc = audioPreloadCache.get(cacheKey);

        if (!audioSrc) {
          preloadStatus.textContent = "Fetching audio...";
          const token = currentUserSession?.access_token || localStorage.getItem('sb_access_token') || '';
          const res = await fetch('/api/tts', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              text: text,
              voiceId: voicePicker.value,
              engine: activeEngine,
              speed: playbackSpeed
            })
          });

          if (res.status === 402) {
            alert("Neural character quota depleted. Swapping to browser voice.");
            document.querySelector('[data-engine="browser"]').click();
            return;
          }

          if (!res.ok) throw new Error(`Proxy error ${res.status}`);
          const data = await res.json();
          audioSrc = data.audio_base64 
            ? `data:audio/mp3;base64,${data.audio_base64}`
            : (data.audioUrl || '');
        }

        audioElement.src = audioSrc;
        audioElement.playbackRate = playbackSpeed;
        await audioElement.play();

        // Fluid time-based Karaoke interpolation for Neural streams
        const totalWords = text.trim().split(/\s+/).length;
        audioElement.ontimeupdate = () => {
          if (audioElement.duration) {
            const fraction = audioElement.currentTime / audioElement.duration;
            const targetWord = Math.min(totalWords - 1, Math.floor(fraction * totalWords));
            highlightActiveWord(targetWord);
          }
        };

        audioElement.onended = () => {
          if (!isPlaying) return;
          currentSentenceIdx++;
          playCurrentSentence();
        };

      } catch (err) {
        console.warn("Neural backend error, falling back to local voice:", err);
        speakBrowser(text);
      }
    }

    function stopAudio() {
      isPlaying = false;
      browserSpeech.cancel();
      audioElement.pause();
      document.querySelectorAll('.word').forEach(el => el.classList.remove('active-word'));
    }

    // --- SUPABASE AUTHENTICATION CONTROLLER ---
    async function updateAuthBadge() {
      if (!supabaseClient) {
        creditDisplay.textContent = "⚡ Free Tier";
        return;
      }

      const { data: { session } } = await supabaseClient.auth.getSession();
      currentUserSession = session;

      if (session && session.user) {
        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('neural_chars_remaining, tier')
          .eq('id', session.user.id)
          .single();

        const remaining = profile ? profile.neural_chars_remaining.toLocaleString() : '5,000';
        creditDisplay.textContent = `⚡ ${remaining} Chars`;
      } else {
        creditDisplay.textContent = "Sign In";
      }
    }

    creditBadge.addEventListener('click', () => {
      authModal.style.display = 'flex';
    });
    authCloseBtn.addEventListener('click', () => {
      authModal.style.display = 'none';
    });

    authSignInBtn.addEventListener('click', async () => {
      if (!supabaseClient) {
        alert("Supabase credentials not configured in index.html.");
        authModal.style.display = 'none';
        return;
      }
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: authEmail.value,
        password: authPass.value
      });
      if (error) alert(error.message);
      else {
        authModal.style.display = 'none';
        updateAuthBadge();
      }
    });

    authSignUpBtn.addEventListener('click', async () => {
      if (!supabaseClient) {
        alert("Supabase credentials not configured in index.html.");
        authModal.style.display = 'none';
        return;
      }
      const { data, error } = await supabaseClient.auth.signUp({
        email: authEmail.value,
        password: authPass.value
      });
      if (error) alert(error.message);
      else {
        alert("Account created. Check your inbox for confirmation.");
        authModal.style.display = 'none';
      }
    });

    // --- UNIVERSAL DOCUMENT PARSER ---
    function splitIntoSentences(text) {
      if (!text || !text.trim()) return [];

      if (typeof Intl !== 'undefined' && Intl.Segmenter) {
        try {
          const segmenter = new Intl.Segmenter('en', { granularity: 'sentence' });
          const segments = Array.from(segmenter.segment(text));
          const sentences = segments
            .map(s => s.segment.replace(/\s+/g, ' ').trim())
            .filter(s => s.length > 0);
          if (sentences.length > 0) return sentences;
        } catch (e) {
          console.warn("Segmenter fallback:", e);
        }
      }

      const raw = text.replace(/([.?!]+)(\s+)/g, "$1\n---BREAK---\n").split("\n---BREAK---\n");
      return raw.map(s => s.replace(/\s+/g, ' ').trim()).filter(s => s.length > 0);
    }

    fileInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      stopAudio();
      audioPreloadCache.clear();
      currentDocName = file.name;
      docTitle.textContent = currentDocName;
      contentPane.innerHTML = `<div style="text-align:center; padding:3rem; color:var(--text-muted); font-style:italic;">Processing document: ${file.name}...</div>`;

      try {
        const ext = file.name.split('.').pop().toLowerCase();
        let extractedText = "";

        if (ext === 'txt' || ext === 'md') {
          extractedText = await file.text();
        } 
        else if (ext === 'html' || ext === 'htm') {
          const raw = await file.text();
          const doc = new DOMParser().parseFromString(raw, 'text/html');
          extractedText = (doc.body ? doc.body.textContent : doc.documentElement.textContent) || "";
        } 
        else if (ext === 'docx') {
          const buf = await file.arrayBuffer();
          const res = await mammoth.extractRawText({ arrayBuffer: buf });
          extractedText = res.value || "";
        } 
        else if (ext === 'pdf') {
          const buf = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
          let pages = [];
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            pages.push(content.items.map(it => it.str).join(' '));
          }
          extractedText = pages.join('\n\n');
        } 
        else if (ext === 'epub') {
          const buf = await file.arrayBuffer();
          const zip = await JSZip.loadAsync(buf);
          const fileNames = Object.keys(zip.files).filter(name => {
            const lower = name.toLowerCase();
            return (lower.endsWith('.xhtml') || lower.endsWith('.html') || lower.endsWith('.htm')) &&
                   !lower.includes('toc') && !lower.endsWith('.ncx');
          }).sort();

          let chapters = [];
          for (const name of fileNames) {
            const rawHtml = await zip.files[name].async("text");
            const doc = new DOMParser().parseFromString(rawHtml, 'text/html');
            const clean = (doc.body ? doc.body.textContent : doc.documentElement.textContent || '').replace(/\s+/g, ' ').trim();
            if (clean.length > 25) chapters.push(clean);
          }
          extractedText = chapters.join('\n\n');
        }

        const sentences = splitIntoSentences(extractedText);
        if (sentences.length === 0) throw new Error("No readable text detected.");

        bookPages = [];
        const perPage = 5;
        for (let i = 0; i < sentences.length; i += perPage) {
          bookPages.push(sentences.slice(i, i + perPage));
        }

        currentPage = 0;
        currentSentenceIdx = 0;
        renderPage(0);
      } catch (err) {
        alert("Failed to parse file: " + err.message);
        renderPage(currentPage);
      }
    });

    // --- CONTROLS INITIALIZATION ---
    function populateVoices() {
      voicePicker.innerHTML = '';
      if (activeEngine === 'browser') {
        const voices = browserSpeech.getVoices();
        if (!voices || voices.length === 0) {
          const opt = document.createElement('option');
          opt.value = "";
          opt.textContent = "Loading system voices...";
          voicePicker.appendChild(opt);
          return;
        }
        voices.forEach((v, idx) => {
          const opt = document.createElement('option');
          opt.value = idx;
          opt.textContent = `${v.name} (${v.lang})`;
          voicePicker.appendChild(opt);
        });
      } else {
        const list = voicePresets[activeEngine] || [];
        list.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item.id;
          opt.textContent = item.name;
          voicePicker.appendChild(opt);
        });
      }
    }

    if (typeof speechSynthesis !== 'undefined') {
      speechSynthesis.onvoiceschanged = () => {
        if (activeEngine === 'browser') populateVoices();
      };
    }

    document.querySelectorAll('.engine-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.engine-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeEngine = tab.dataset.engine;
        audioPreloadCache.clear();
        populateVoices();

        if (isPlaying) {
          stopAudio();
          isPlaying = true;
          playCurrentSentence();
        }
      });
    });

    speedSlider.addEventListener('input', (e) => {
      playbackSpeed = parseFloat(e.target.value);
      speedDisplay.textContent = `${playbackSpeed.toFixed(1)}x`;
      audioPreloadCache.clear();

      if (isPlaying) {
        if (activeEngine === 'browser') {
          browserSpeech.cancel();
          playCurrentSentence();
        } else {
          audioElement.playbackRate = playbackSpeed;
        }
      }
      saveSessionProgress();
    });

    pageJumpInput.addEventListener('change', (e) => {
      let pageNum = parseInt(e.target.value, 10);
      if (isNaN(pageNum) || pageNum < 1) pageNum = 1;
      if (pageNum > bookPages.length) pageNum = bookPages.length;

      currentPage = pageNum - 1;
      currentSentenceIdx = 0;
      const wasPlaying = isPlaying;
      stopAudio();
      renderPage(currentPage);
      if (wasPlaying) {
        isPlaying = true;
        playCurrentSentence();
      }
    });

    playBtn.addEventListener('click', () => {
      isPlaying = true;
      playCurrentSentence();
    });

    pauseBtn.addEventListener('click', stopAudio);

    prevPageBtn.addEventListener('click', () => {
      if (currentPage > 0) {
        currentPage--;
        currentSentenceIdx = 0;
        const wasPlaying = isPlaying;
        stopAudio();
        renderPage(currentPage);
        if (wasPlaying) {
          isPlaying = true;
          playCurrentSentence();
        }
      }
    });

    nextPageBtn.addEventListener('click', () => {
      if (currentPage < bookPages.length - 1) {
        currentPage++;
        currentSentenceIdx = 0;
        const wasPlaying = isPlaying;
        stopAudio();
        renderPage(currentPage);
        if (wasPlaying) {
          isPlaying = true;
          playCurrentSentence();
        }
      }
    });

    themeSelect.addEventListener('change', (e) => {
      document.documentElement.setAttribute('data-theme', e.target.value);
      localStorage.setItem('marginalia_theme', e.target.value);
      saveSessionProgress();
    });

    // --- APPLICATION STARTUP ---
    const savedTheme = localStorage.getItem('marginalia_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeSelect.value = savedTheme;

    loadSessionProgress();
    populateVoices();
    renderPage(currentPage);
    updateAuthBadge();
  </script>
</body>
</html>
