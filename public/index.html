<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Marginalia — Read-Along Reader</title>

  <!-- Client-Side Document Parsers -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <style>
    :root {
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-reader: "Georgia", "Merriweather", "Charter", serif;
      --transition: 0.2s ease;
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }

    [data-theme="light"] {
      --bg-main: #f8fafc;
      --panel-bg: #ffffff;
      --panel-blur: rgba(255, 255, 255, 0.92);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent-active: #1d4ed8;
      --highlight: rgba(254, 215, 10, 0.4);
      --highlight-border: #d97706;
      --word-active: #0284c7;
      --word-text: #ffffff;
      --tab-active-bg: #f1f5f9;
      --modal-overlay: rgba(15, 23, 42, 0.5);
    }

    [data-theme="sepia"] {
      --bg-main: #f4ecd8;
      --panel-bg: #eae0c8;
      --panel-blur: rgba(234, 224, 200, 0.92);
      --text-main: #42321e;
      --text-muted: #7d674c;
      --border: #d4c4a8;
      --accent: #b45309;
      --accent-active: #92400e;
      --highlight: rgba(217, 119, 6, 0.28);
      --highlight-border: #b45309;
      --word-active: #78350f;
      --word-text: #ffffff;
      --tab-active-bg: #dfceb0;
      --modal-overlay: rgba(66, 50, 30, 0.5);
    }

    [data-theme="dark"] {
      --bg-main: #0b1120;
      --panel-bg: #151e32;
      --panel-blur: rgba(21, 30, 50, 0.92);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #23314e;
      --accent: #38bdf8;
      --accent-active: #0284c7;
      --highlight: rgba(56, 189, 248, 0.25);
      --highlight-border: #38bdf8;
      --word-active: #38bdf8;
      --word-text: #0b1120;
      --tab-active-bg: #1e293b;
      --modal-overlay: rgba(0, 0, 0, 0.7);
    }

    [data-theme="oled"] {
      --bg-main: #000000;
      --panel-bg: #0d0d0d;
      --panel-blur: rgba(13, 13, 13, 0.94);
      --text-main: #ededed;
      --text-muted: #737373;
      --border: #262626;
      --accent: #10b981;
      --accent-active: #059669;
      --highlight: rgba(16, 185, 129, 0.28);
      --highlight-border: #10b981;
      --word-active: #10b981;
      --word-text: #000000;
      --tab-active-bg: #222222;
      --modal-overlay: rgba(0, 0, 0, 0.85);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      touch-action: manipulation; /* Eliminates 300ms tap delay */
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-ui);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      transition: background-color var(--transition), color var(--transition);
      -webkit-tap-highlight-color: transparent;
      padding-bottom: calc(90px + var(--safe-bottom)); /* Clearance for sticky player */
    }

    /* TOP HEADER */
    header {
      padding: 0.75rem 1rem;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(8px);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      user-select: none;
    }

    .brand-logo {
      width: 26px;
      height: 26px;
      color: var(--accent);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    button, select, label.btn-ui, input[type="number"] {
      background: var(--bg-main);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.45rem 0.65rem;
      border-radius: 6px;
      font-size: 16px; /* Strictly 16px to prevent iOS Safari auto-zoom */
      cursor: pointer;
      outline: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-family: var(--font-ui);
      transition: border-color var(--transition);
    }

    @media (min-width: 641px) {
      button, select, label.btn-ui, input[type="number"] {
        font-size: 0.85rem;
      }
    }

    select option {
      background: var(--panel-bg);
      color: var(--text-main);
    }

    .credit-badge {
      font-size: 0.78rem;
      padding: 0.35rem 0.65rem;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--border);
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    /* ENGINE & VOICE DRAWER */
    .controls-panel {
      max-width: 860px;
      width: calc(100% - 1.5rem);
      margin: 0.75rem auto 0;
      padding: 0.85rem 1rem;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .engine-tabs-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .engine-tabs-group::-webkit-scrollbar { display: none; }

    .engine-tab {
      background: var(--bg-main);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      flex-shrink: 0;
      transition: all var(--transition);
    }

    .engine-tab.active {
      background: var(--tab-active-bg);
      color: var(--text-main);
      border-color: var(--accent);
      font-weight: 600;
      box-shadow: 0 0 0 1px var(--accent);
    }

    .settings-sub-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .setting-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      color: var(--text-muted);
      flex: 1;
      min-width: 130px;
    }

    .setting-group select {
      flex: 1;
      width: 100%;
    }

    /* READING CONTAINER */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.75rem 0.75rem 2rem;
    }

    .reader-card {
      max-width: 860px;
      width: 100%;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem 1.15rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      min-height: calc(100dvh - 300px);
    }

    @media (min-width: 641px) {
      .reader-card {
        padding: 3rem 2.5rem;
      }
    }

    .doc-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 0.4rem;
      display: flex;
      justify-content: space-between;
    }

    .book-content {
      font-family: var(--font-reader);
      font-size: 1.22rem;
      line-height: 2.1;
      letter-spacing: 0.01rem;
      user-select: text;
    }

    @media (min-width: 641px) {
      .book-content {
        font-size: 1.32rem;
        line-height: 2.2;
      }
    }

    /* SUBTLE HIGHLIGHTING */
    .sentence {
      padding: 2px 3px;
      border-radius: 4px;
      transition: background-color 0.15s ease;
      cursor: pointer;
      text-decoration: none !important;
    }

    .sentence.active-sentence {
      background-color: var(--highlight) !important;
      box-shadow: 0 0 0 1px var(--highlight-border);
      border-radius: 4px;
    }

    .word {
      display: inline-block;
      border-radius: 3px;
      padding: 0 1px;
      transition: background-color 0.08s ease, color 0.08s ease;
    }

    .word.active-word {
      background-color: var(--word-active);
      color: var(--word-text) !important;
      font-weight: 600;
    }

    /* STICKY FLOATING BOTTOM PLAYER */
    .mobile-player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--panel-blur);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      padding: 0.65rem 1rem calc(0.65rem + var(--safe-bottom));
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .player-nav-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .player-btn-main {
      background: var(--accent);
      color: #fff;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }
    .player-btn-main:active { transform: scale(0.95); }

    .player-btn-nav {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      padding: 0;
    }

    .player-status-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .speed-pill-btn {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.3rem 0.55rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    /* AUTH MODAL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--modal-overlay);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 360px;
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-title { font-size: 1.15rem; font-weight: 700; }
    .input-field {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-main);
      color: var(--text-main);
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header>
    <div class="brand-group">
      <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
        <path d="M8 7h8"/>
        <path d="M8 11h5"/>
        <path d="M12 17a2 2 0 0 0 2-2v-2a2 2 0 0 0-4 0v2a2 2 0 0 0 2 2Z"/>
      </svg>
      <span class="brand-title">Marginalia</span>
    </div>

    <div class="header-actions">
      <div id="creditBadge" class="credit-badge">
        <span id="creditDisplay">Sign In</span>
      </div>

      <label class="btn-ui" for="fileInput" style="padding:0.4rem 0.55rem;">📁 File</label>
      <input type="file" id="fileInput" accept=".txt,.md,.pdf,.docx,.epub,.html,.htm,application/epub+zip,application/pdf" style="display:none;" />

      <select id="themeSelect" style="padding:0.4rem 0.5rem;">
        <option value="light">Light</option>
        <option value="sepia">Sepia</option>
        <option value="dark">Dark</option>
        <option value="oled">OLED</option>
      </select>
    </div>
  </header>

  <main>
    <!-- VOICE & ENGINE SELECTOR DRAWER -->
    <div class="controls-panel">
      <div class="engine-tabs-group">
        <button class="engine-tab active" data-engine="browser">Browser Native</button>
        <button class="engine-tab" data-engine="elevenlabs">ElevenLabs</button>
        <button class="engine-tab" data-engine="openai">OpenAI Audio</button>
        <button class="engine-tab" data-engine="google">Google Cloud</button>
        <button class="engine-tab" data-engine="azure">Azure Speech</button>
      </div>

      <div class="settings-sub-bar">
        <div class="setting-group">
          <span>Voice:</span>
          <select id="voicePicker"></select>
        </div>

        <label style="display:flex; align-items:center; gap:0.4rem; font-size:0.82rem; cursor:pointer; color:var(--text-muted);">
          <input type="checkbox" id="autoFlipCheck" checked style="accent-color: var(--accent);" />
          <span>Auto-turn page</span>
        </label>
      </div>
    </div>

    <!-- BOOK CARD -->
    <div class="reader-card">
      <div class="doc-meta">
        <span id="docTitle">Marginalia Reader</span>
        <span id="preloadStatus">Ready</span>
      </div>

      <div id="contentPane" class="book-content"></div>
    </div>
  </main>

  <!-- STICKY FLOATING BOTTOM PLAYER (ACCESSIBLE IN THUMB ZONE) -->
  <div class="mobile-player-bar">
    <div class="player-nav-group">
      <button id="prevPageBtn" class="player-btn-nav" title="Previous Page">←</button>
      <button id="mainPlayToggle" class="player-btn-main">▶</button>
      <button id="nextPageBtn" class="player-btn-nav" title="Next Page">→</button>
    </div>

    <div class="player-status-group">
      <span id="pageIndicatorText" style="font-weight:600; font-size:0.85rem; color:var(--text-main);">Page 1 of 1</span>
      <span style="font-size:0.75rem;">Continuous Audio</span>
    </div>

    <button id="speedCycleBtn" class="speed-pill-btn">1.0x</button>
  </div>

  <!-- AUTH MODAL -->
  <div id="authModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-title">Account & Quota Access</div>
      <p style="font-size:0.85rem; color:var(--text-muted);">Log in to use your neural cloud voices across devices.</p>
      <input type="email" id="authEmail" class="input-field" placeholder="Email address" />
      <input type="password" id="authPass" class="input-field" placeholder="Password" />
      <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
        <button id="authCloseBtn">Cancel</button>
        <button id="authSignUpBtn">Sign Up</button>
        <button id="authSignInBtn" style="background:var(--accent); color:#fff; border:none; font-weight:600;">Sign In</button>
      </div>
    </div>
  </div>

  <audio id="neuralAudio" style="display:none;" playsinline></audio>

  <script>
    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_PROJECT_URL = "https://nnxphilhkhvwnitxvzdi.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_ekzdgLR6FSDHnP2DZNklMQ_n3-k0ZLN";

    let supabaseClient = null;
    if (SUPABASE_PROJECT_URL && !SUPABASE_PROJECT_URL.includes("your-project")) {
      try {
        supabaseClient = supabase.createClient(SUPABASE_PROJECT_URL, SUPABASE_ANON_KEY);
      } catch (err) {
        console.warn("Supabase client init:", err);
      }
    }

    const voicePresets = {
      browser: [],
      elevenlabs: [
        { id: '21m00Tcm4TlvDq8ikWAM', name: 'Rachel (Calm & Natural)' },
        { id: 'AZnzlk1XvdvUeBnXmlld', name: 'Domi (Empathetic)' },
        { id: 'EXAVITQu4vr4xnSDxMaL', name: 'Bella (Expressive)' },
        { id: 'ErXwobaYiN019PkySvjV', name: 'Antoni (Well-rounded)' },
        { id: 'pNInz6obpgDQGcFmaJgB', name: 'Adam (Deep Baritone)' }
      ],
      openai: [
        { id: 'alloy', name: 'Alloy (Balanced)' },
        { id: 'echo', name: 'Echo (Warm)' },
        { id: 'fable', name: 'Fable (British Accent)' },
        { id: 'onyx', name: 'Onyx (Deep Authoritative)' },
        { id: 'nova', name: 'Nova (Energetic)' },
        { id: 'shimmer', name: 'Shimmer (Clear)' }
      ],
      google: [
        { id: 'en-US-Journey-F', name: 'Journey Female (Natural)' },
        { id: 'en-US-Journey-D', name: 'Journey Male (Deep)' },
        { id: 'en-US-Neural2-F', name: 'Neural2 Female' }
      ],
      azure: [
        { id: 'en-US-JennyNeural', name: 'Jenny (Neural US)' },
        { id: 'en-US-GuyNeural', name: 'Guy (Neural US)' },
        { id: 'en-GB-SoniaNeural', name: 'Sonia (Neural UK)' }
      ]
    };

    let currentDocName = "Marginalia Mobile";
    let bookPages = [
      [
        "Welcome to Marginalia Mobile.",
        "Notice the sticky control bar at the bottom: your thumbs can always reach Play, Pause, and Page flipping.",
        "Your phone screen will stay awake automatically while listening.",
        "Tap on any sentence directly to jump playback instantly."
      ]
    ];

    let currentPage = 0;
    let currentSentenceIdx = 0;
    let isPlaying = false;
    let activeEngine = 'browser';
    let playbackSpeed = 1.0;
    const speedSteps = [0.8, 1.0, 1.2, 1.5, 1.8, 2.0];

    const browserSpeech = window.speechSynthesis;
    let currentUtterance = null;
    const audioElement = document.getElementById('neuralAudio');
    const audioPreloadCache = new Map();
    let wordTimerInterval = null;
    let wakeLock = null;
    let iosWatchdogInterval = null;

    // DOM Elements
    const contentPane = document.getElementById('contentPane');
    const mainPlayToggle = document.getElementById('mainPlayToggle');
    const prevPageBtn = document.getElementById('prevPageBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');
    const pageIndicatorText = document.getElementById('pageIndicatorText');
    const speedCycleBtn = document.getElementById('speedCycleBtn');
    const autoFlipCheck = document.getElementById('autoFlipCheck');
    const themeSelect = document.getElementById('themeSelect');
    const voicePicker = document.getElementById('voicePicker');
    const fileInput = document.getElementById('fileInput');
    const docTitle = document.getElementById('docTitle');
    const preloadStatus = document.getElementById('preloadStatus');
    const creditBadge = document.getElementById('creditBadge');
    const creditDisplay = document.getElementById('creditDisplay');
    const authModal = document.getElementById('authModal');
    const authEmail = document.getElementById('authEmail');
    const authPass = document.getElementById('authPass');
    const authSignInBtn = document.getElementById('authSignInBtn');
    const authSignUpBtn = document.getElementById('authSignUpBtn');
    const authCloseBtn = document.getElementById('authCloseBtn');

    // --- SCREEN WAKE LOCK API ---
    async function requestScreenWakeLock() {
      try {
        if ('wakeLock' in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function releaseScreenWakeLock() {
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    // --- RE-ACQUIRE WAKE LOCK ON APP RESUME ---
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && isPlaying) {
        requestScreenWakeLock();
      }
    });

    // --- TOKEN & USER QUOTA ---
    async function getFreshAuthToken() {
      if (!supabaseClient) return null;
      const { data: { session } } = await supabaseClient.auth.getSession();
      return session?.access_token || null;
    }

    async function updateAuthBadge(explicitRemaining = null) {
      if (!supabaseClient) {
        creditDisplay.textContent = "⚡ Free Tier";
        return;
      }
      if (explicitRemaining !== null) {
        creditDisplay.textContent = `⚡ ${explicitRemaining.toLocaleString()} Chars`;
        return;
      }
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session && session.user) {
        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('neural_chars_remaining')
          .eq('id', session.user.id)
          .single();

        const remaining = profile ? profile.neural_chars_remaining : 5000;
        creditDisplay.textContent = `⚡ ${remaining.toLocaleString()} Chars`;
      } else {
        creditDisplay.textContent = "Sign In";
      }
    }

    // --- MOBILE-RELIABLE VOICE POPULATION ---
    function populateVoices() {
      const prevChoice = voicePicker.value;
      voicePicker.innerHTML = '';

      if (activeEngine === 'browser') {
        const voices = browserSpeech.getVoices();
        if (!voices || voices.length === 0) {
          const opt = document.createElement('option');
          opt.value = "default";
          opt.textContent = "Default Mobile Voice";
          voicePicker.appendChild(opt);
          return;
        }
        voices.forEach((v, idx) => {
          const opt = document.createElement('option');
          opt.value = idx;
          opt.textContent = `${v.name} (${v.lang})`;
          if (idx.toString() === prevChoice) opt.selected = true;
          voicePicker.appendChild(opt);
        });
      } else {
        const list = voicePresets[activeEngine] || [];
        list.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item.id;
          opt.textContent = item.name;
          if (item.id === prevChoice) opt.selected = true;
          voicePicker.appendChild(opt);
        });
      }
    }

    if (typeof speechSynthesis !== 'undefined') {
      speechSynthesis.onvoiceschanged = populateVoices;
    }
    ['touchstart', 'click'].forEach(evt => {
      document.body.addEventListener(evt, () => {
        if (voicePicker.children.length <= 1) populateVoices();
      }, { once: true });
    });

    voicePicker.addEventListener('change', () => {
      audioPreloadCache.clear();
      if (isPlaying) {
        stopAudio();
        isPlaying = true;
        playCurrentSentence();
      }
    });

    document.querySelectorAll('.engine-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.engine-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeEngine = tab.dataset.engine;
        audioPreloadCache.clear();
        populateVoices();

        if (isPlaying) {
          stopAudio();
          isPlaying = true;
          playCurrentSentence();
        }
      });
    });

    // --- SPEED CYCLER (SINGLE MOBILE TAP BUTTON) ---
    speedCycleBtn.addEventListener('click', () => {
      let nextIdx = (speedSteps.indexOf(playbackSpeed) + 1) % speedSteps.length;
      playbackSpeed = speedSteps[nextIdx];
      speedCycleBtn.textContent = `${playbackSpeed.toFixed(1)}x`;
      audioPreloadCache.clear();

      if (isPlaying) {
        if (activeEngine === 'browser') {
          browserSpeech.cancel();
          playCurrentSentence();
        } else {
          audioElement.playbackRate = playbackSpeed;
        }
      }
    });

    // --- SENTENCE & WORD DOM ---
    function buildSentenceDOM(sentenceText, sIdx) {
      const sentenceSpan = document.createElement('span');
      sentenceSpan.className = 'sentence';
      sentenceSpan.id = `sent-${sIdx}`;

      const words = sentenceText.split(/(\s+)/);
      let wordCount = 0;

      words.forEach(chunk => {
        if (chunk.trim().length > 0) {
          const wordSpan = document.createElement('span');
          wordSpan.className = 'word';
          wordSpan.id = `w-${sIdx}-${wordCount}`;
          wordSpan.textContent = chunk;
          sentenceSpan.appendChild(wordSpan);
          wordCount++;
        } else {
          sentenceSpan.appendChild(document.createTextNode(chunk));
        }
      });

      sentenceSpan.addEventListener('click', () => {
        currentSentenceIdx = sIdx;
        if (isPlaying) {
          stopAudio();
          isPlaying = true;
          playCurrentSentence();
        } else {
          highlightActiveSentence();
        }
      });

      return sentenceSpan;
    }

    function renderPage(idx) {
      contentPane.innerHTML = '';
      const sentences = bookPages[idx] || [];

      sentences.forEach((txt, sIdx) => {
        contentPane.appendChild(buildSentenceDOM(txt, sIdx));
      });

      pageIndicatorText.textContent = `Page ${idx + 1} of ${bookPages.length}`;
      prevPageBtn.disabled = idx === 0;
      nextPageBtn.disabled = idx >= bookPages.length - 1;
      highlightActiveSentence();
    }

    // Focal vertical auto-center: places reading target in comfortable view
    function highlightActiveSentence() {
      document.querySelectorAll('.sentence').forEach(el => el.classList.remove('active-sentence'));
      document.querySelectorAll('.word').forEach(el => el.classList.remove('active-word'));

      const target = document.getElementById(`sent-${currentSentenceIdx}`);
      if (target) {
        target.classList.add('active-sentence');
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function highlightActiveWord(wIdx) {
      document.querySelectorAll(`#sent-${currentSentenceIdx} .word`).forEach((el, index) => {
        if (index === wIdx) el.classList.add('active-word');
        else el.classList.remove('active-word');
      });
    }

    // --- SMART PLAYBACK & iOS WATCHDOG ---
    async function playCurrentSentence() {
      const pageSentences = bookPages[currentPage];
      if (!pageSentences || pageSentences.length === 0) return;

      if (currentSentenceIdx >= pageSentences.length) {
        if (autoFlipCheck.checked && currentPage < bookPages.length - 1) {
          currentPage++;
          currentSentenceIdx = 0;
          renderPage(currentPage);
          playCurrentSentence();
        } else {
          stopAudio();
        }
        return;
      }

      highlightActiveSentence();
      mainPlayToggle.textContent = '⏸';
      requestScreenWakeLock();

      const textToRead = pageSentences[currentSentenceIdx];
      syncMediaSession(textToRead);

      if (activeEngine === 'browser') {
        speakBrowser(textToRead);
      } else {
        await speakServerless(textToRead);
      }
    }

    function speakBrowser(text) {
      browserSpeech.cancel();
      if (wordTimerInterval) clearInterval(wordTimerInterval);
      if (iosWatchdogInterval) clearInterval(iosWatchdogInterval);

      currentUtterance = new SpeechSynthesisUtterance(text);
      currentUtterance.rate = playbackSpeed;

      const voices = browserSpeech.getVoices();
      if (voices.length > 0 && voicePicker.value !== "" && voicePicker.value !== "default") {
        currentUtterance.voice = voices[parseInt(voicePicker.value, 10)] || voices[0];
      }

      let nativeBoundaryFired = false;
      currentUtterance.onboundary = (e) => {
        if (e.name === 'word') {
          nativeBoundaryFired = true;
          if (wordTimerInterval) clearInterval(wordTimerInterval);
          const words = text.slice(0, e.charIndex).trim().split(/\s+/);
          const currentWordIdx = words[0] === "" ? 0 : words.length;
          highlightActiveWord(currentWordIdx);
        }
      };

      // Fallback for mobile WebKit if onboundary is suppressed
      const wordsArr = text.trim().split(/\s+/);
      const totalWords = wordsArr.length;
      let mobileWordIdx = 0;
      const msPerWord = Math.max(120, (60000 / (180 * playbackSpeed)));

      setTimeout(() => {
        if (!nativeBoundaryFired && isPlaying) {
          highlightActiveWord(0);
          wordTimerInterval = setInterval(() => {
            if (mobileWordIdx < totalWords - 1) {
              mobileWordIdx++;
              highlightActiveWord(mobileWordIdx);
            } else {
              clearInterval(wordTimerInterval);
            }
          }, msPerWord);
        }
      }, 200);

      // Safari background keepalive: prevents iOS from killing playback
      iosWatchdogInterval = setInterval(() => {
        if (browserSpeech.speaking) browserSpeech.resume();
      }, 5000);

      currentUtterance.onend = () => {
        if (wordTimerInterval) clearInterval(wordTimerInterval);
        if (iosWatchdogInterval) clearInterval(iosWatchdogInterval);
        if (!isPlaying) return;
        currentSentenceIdx++;
        playCurrentSentence();
      };

      currentUtterance.onerror = () => stopAudio();
      browserSpeech.speak(currentUtterance);
    }

    async function speakServerless(text) {
      try {
        const token = await getFreshAuthToken();
        if (!token) {
          stopAudio();
          alert("Please sign in to access cloud voices.");
          authModal.style.display = 'flex';
          return;
        }

        const cacheKey = `${activeEngine}_${voicePicker.value}_${playbackSpeed}_${text}`;
        let cached = audioPreloadCache.get(cacheKey);
        let audioSrc = cached?.src;

        if (!audioSrc) {
          preloadStatus.textContent = "Connecting...";
          const res = await fetch('/api/tts', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              text,
              voiceId: voicePicker.value,
              engine: activeEngine,
              speed: playbackSpeed
            })
          });

          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || `Error ${res.status}`);

          audioSrc = data.audio_base64 
            ? `data:audio/mp3;base64,${data.audio_base64}`
            : (data.audioUrl || '');

          if (data.remaining_chars !== undefined) updateAuthBadge(data.remaining_chars);
        }

        audioElement.src = audioSrc;
        audioElement.playbackRate = playbackSpeed;
        await audioElement.play();

        const totalWords = text.trim().split(/\s+/).length;
        audioElement.ontimeupdate = () => {
          if (audioElement.duration) {
            const fraction = audioElement.currentTime / audioElement.duration;
            const targetWord = Math.min(totalWords - 1, Math.floor(fraction * totalWords));
            highlightActiveWord(targetWord);
          }
        };

        audioElement.onended = () => {
          if (!isPlaying) return;
          currentSentenceIdx++;
          playCurrentSentence();
        };

      } catch (err) {
        stopAudio();
        alert(err.message);
      }
    }

    function stopAudio() {
      isPlaying = false;
      mainPlayToggle.textContent = '▶';
      releaseScreenWakeLock();
      if (wordTimerInterval) clearInterval(wordTimerInterval);
      if (iosWatchdogInterval) clearInterval(iosWatchdogInterval);
      browserSpeech.cancel();
      audioElement.pause();
      document.querySelectorAll('.word').forEach(el => el.classList.remove('active-word'));
    }

    function syncMediaSession(sentenceText) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: currentDocName,
          artist: `Page ${currentPage + 1} of ${bookPages.length}`,
          album: 'Marginalia'
        });
        navigator.mediaSession.setActionHandler('play', () => { isPlaying = true; playCurrentSentence(); });
        navigator.mediaSession.setActionHandler('pause', stopAudio);
        navigator.mediaSession.setActionHandler('previoustrack', () => {
          if (currentSentenceIdx > 0) currentSentenceIdx--;
          playCurrentSentence();
        });
        navigator.mediaSession.setActionHandler('nexttrack', () => {
          currentSentenceIdx++;
          playCurrentSentence();
        });
      }
    }

    // --- UNIVERSAL FILE & EPUB PARSER ---
    function htmlToCleanText(rawHtml) {
      return rawHtml
        .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '')
        .replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '')
        .replace(/<[^>]+>/g, ' ')
        .replace(/&nbsp;/gi, ' ')
        .replace(/&amp;/gi, '&')
        .replace(/&lt;/gi, '<')
        .replace(/&gt;/gi, '>')
        .replace(/&quot;/gi, '"')
        .replace(/&#39;/gi, "'")
        .replace(/\s+/g, ' ')
        .trim();
    }

    function splitIntoSentences(text) {
      if (!text || !text.trim()) return [];
      if (typeof Intl !== 'undefined' && Intl.Segmenter) {
        try {
          const segmenter = new Intl.Segmenter('en', { granularity: 'sentence' });
          const segments = Array.from(segmenter.segment(text));
          const sentences = segments
            .map(s => s.segment.replace(/\s+/g, ' ').trim())
            .filter(s => s.length > 0);
          if (sentences.length > 0) return sentences;
        } catch (e) {}
      }
      return text.replace(/([.?!]+)(\s+)/g, "$1\n---BREAK---\n")
                 .split("\n---BREAK---\n")
                 .map(s => s.replace(/\s+/g, ' ').trim())
                 .filter(s => s.length > 0);
    }

    fileInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      stopAudio();
      audioPreloadCache.clear();
      currentDocName = file.name;
      docTitle.textContent = currentDocName;
      contentPane.innerHTML = `<div style="text-align:center; padding:3rem; color:var(--text-muted); font-style:italic;">Opening ${file.name}...</div>`;

      try {
        const ext = file.name.split('.').pop().toLowerCase();
        let extractedText = "";

        if (ext === 'txt' || ext === 'md') {
          extractedText = await file.text();
        } 
        else if (ext === 'html' || ext === 'htm') {
          extractedText = htmlToCleanText(await file.text());
        } 
        else if (ext === 'docx') {
          const buf = await file.arrayBuffer();
          const res = await mammoth.extractRawText({ arrayBuffer: buf });
          extractedText = res.value || "";
        } 
        else if (ext === 'pdf') {
          const buf = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
          let pages = [];
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            pages.push(content.items.map(it => it.str).join(' '));
          }
          extractedText = pages.join('\n\n');
        } 
        else if (ext === 'epub' || file.type.includes('epub')) {
          const buf = await file.arrayBuffer();
          const zip = await JSZip.loadAsync(buf);

          let opfPath = "";
          const containerFile = zip.files["META-INF/container.xml"];
          if (containerFile) {
            const containerXml = await containerFile.async("text");
            const match = containerXml.match(/full-path=["']([^"']+)["']/i);
            if (match) opfPath = match[1];
          }

          let orderedFiles = [];
          if (opfPath && zip.files[opfPath]) {
            const opfXml = await zip.files[opfPath].async("text");
            const basePath = opfPath.includes('/') ? opfPath.substring(0, opfPath.lastIndexOf('/') + 1) : '';

            const manifestMap = {};
            const itemMatches = opfXml.matchAll(/<item\s+[^>]*id=["']([^"']+)["'][^>]*href=["']([^"']+)["']/gi);
            for (const m of itemMatches) {
              manifestMap[m[1]] = basePath + decodeURI(m[2]);
            }

            const spineMatches = opfXml.matchAll(/<itemref\s+[^>]*idref=["']([^"']+)["']/gi);
            for (const m of spineMatches) {
              const fullHref = manifestMap[m[1]];
              if (fullHref && zip.files[fullHref]) orderedFiles.push(fullHref);
            }
          }

          if (orderedFiles.length === 0) {
            orderedFiles = Object.keys(zip.files).filter(name => {
              const lower = name.toLowerCase();
              return (lower.endsWith('.xhtml') || lower.endsWith('.html') || lower.endsWith('.htm')) &&
                     !lower.includes('toc') && !lower.endsWith('.ncx');
            }).sort();
          }

          let chapters = [];
          for (const chapFile of orderedFiles) {
            if (zip.files[chapFile]) {
              const clean = htmlToCleanText(await zip.files[chapFile].async("text"));
              if (clean.length > 25) chapters.push(clean);
            }
          }
          extractedText = chapters.join('\n\n');
        }

        const sentences = splitIntoSentences(extractedText);
        if (sentences.length === 0) throw new Error("No readable text detected.");

        bookPages = [];
        const perPage = 5;
        for (let i = 0; i < sentences.length; i += perPage) {
          bookPages.push(sentences.slice(i, i + perPage));
        }

        currentPage = 0;
        currentSentenceIdx = 0;
        renderPage(0);
      } catch (err) {
        alert("Failed to read file: " + err.message);
        renderPage(currentPage);
      }
    });

    // --- CONTROLS HOOKS ---
    mainPlayToggle.addEventListener('click', () => {
      if (isPlaying) {
        stopAudio();
      } else {
        populateVoices();
        isPlaying = true;
        playCurrentSentence();
      }
    });

    prevPageBtn.addEventListener('click', () => {
      if (currentPage > 0) {
        currentPage--;
        currentSentenceIdx = 0;
        const wasPlaying = isPlaying;
        stopAudio();
        renderPage(currentPage);
        if (wasPlaying) {
          isPlaying = true;
          playCurrentSentence();
        }
      }
    });

    nextPageBtn.addEventListener('click', () => {
      if (currentPage < bookPages.length - 1) {
        currentPage++;
        currentSentenceIdx = 0;
        const wasPlaying = isPlaying;
        stopAudio();
        renderPage(currentPage);
        if (wasPlaying) {
          isPlaying = true;
          playCurrentSentence();
        }
      }
    });

    themeSelect.addEventListener('change', (e) => {
      document.documentElement.setAttribute('data-theme', e.target.value);
      localStorage.setItem('marginalia_theme', e.target.value);
    });

    creditBadge.addEventListener('click', () => { authModal.style.display = 'flex'; });
    authCloseBtn.addEventListener('click', () => { authModal.style.display = 'none'; });

    authSignInBtn.addEventListener('click', async () => {
      if (!supabaseClient) {
        alert("Supabase credentials not configured in index.html.");
        authModal.style.display = 'none';
        return;
      }
      const { error } = await supabaseClient.auth.signInWithPassword({
        email: authEmail.value,
        password: authPass.value
      });
      if (error) alert(error.message);
      else {
        authModal.style.display = 'none';
        updateAuthBadge();
      }
    });

    authSignUpBtn.addEventListener('click', async () => {
      if (!supabaseClient) {
        alert("Supabase credentials not configured in index.html.");
        authModal.style.display = 'none';
        return;
      }
      const { error } = await supabaseClient.auth.signUp({
        email: authEmail.value,
        password: authPass.value
      });
      if (error) alert(error.message);
      else {
        authModal.style.display = 'none';
        updateAuthBadge();
      }
    });

    // Initial Load
    const savedTheme = localStorage.getItem('marginalia_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeSelect.value = savedTheme;

    populateVoices();
    renderPage(0);
    updateAuthBadge();
  </script>
</body>
</html>
